<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BD 成交系統</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #667eea;
  --primary-d: #5568d3;
  --purple: #764ba2;
  --green: #28a745;
  --green-d: #1e7e34;
  --yellow: #ffc107;
  --red: #dc3545;
  --blue: #1e88e5;
  --orange: #fb8c00;
  --bg: #f5f5f5;
  --bg2: #f8f9fa;
  --card: #ffffff;
  --text: #2d2d2d;
  --text2: #555555;
  --text3: #888888;
  --border: #e0e0e0;
  --border2: #eeeeee;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; -webkit-font-smoothing: antialiased; }

/* ── 畫面切換 ── */
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ════════════════════════════════
   登入頁
════════════════════════════════ */
#screen-login { justify-content: center; align-items: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.login-box { background: #fff; border-radius: 16px; padding: 2.5rem 2rem; width: 340px; max-width: 92vw; text-align: center; }
.login-logo { font-size: 36px; font-weight: 700; letter-spacing: -.02em; color: var(--primary); margin-bottom: 6px; }
.login-logo span { color: var(--purple); }
.login-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.login-sub { font-size: 13px; color: var(--text3); margin-bottom: 28px; }
.login-label { font-size: 12px; color: var(--text2); font-weight: 500; text-align: left; margin-bottom: 6px; display: block; }
.login-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 16px; text-align: center; letter-spacing: .2em; color: var(--text); font-family: var(--font); transition: border-color .15s; }
.login-input:focus { outline: none; border-color: var(--primary); }
.login-input.error { border-color: var(--red); animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.login-btn { width: 100%; margin-top: 12px; padding: 11px; border: none; border-radius: var(--radius); background: linear-gradient(135deg, var(--primary), var(--purple)); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: opacity .15s; }
.login-btn:hover { opacity: .9; }
.login-hint { font-size: 12px; color: var(--text3); margin-top: 14px; line-height: 1.6; }
.login-err { font-size: 12px; color: var(--red); margin-top: 8px; min-height: 18px; }

/* ════════════════════════════════
   主 Layout
════════════════════════════════ */
#screen-main { flex-direction: column; }
.topbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 0 1.25rem; height: 52px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; position: sticky; top: 0; z-index: 50; }
.topbar-logo { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
.topbar-logo span { opacity: .7; }
.topbar-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1.5px solid rgba(255,255,255,.5); flex-shrink: 0; }
.topbar-tagline { font-size: 11px; color: rgba(255,255,255,.75); white-space: nowrap; }
.topbar-date { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.9); white-space: nowrap; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.topbar-badge { font-size: 11px; color: rgba(255,255,255,.8); background: rgba(255,255,255,.18); border-radius: 99px; padding: 3px 10px; }
.topbar-icon-btn { background: none; border: none; color: rgba(255,255,255,.8); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; border-radius: 6px; display: flex; align-items: center; }
.topbar-icon-btn:hover { color: #fff; background: rgba(255,255,255,.12); }
body.demo-active .topbar { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }
body.demo-active #mode-badge { background: rgba(255,255,255,.28); font-weight:700; }

.main-body { flex: 1; display: flex; min-height: 0; }

/* ════════════════════════════════
   左側客戶側欄 (HubSpot 風格)
════════════════════════════════ */
.app-layout { display: flex; flex: 1; min-height: 0; width: 100%; }
.sidebar-customers { width: 280px; flex-shrink: 0; border-right: 1px solid var(--border2); background: var(--card); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 12px 14px; border-bottom: 1px solid var(--border2); display: flex; gap: 6px; }
.sidebar-search { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: var(--font); background: var(--card); color: var(--text); }
.sidebar-search:focus { outline: none; border-color: var(--primary); }
.sidebar-stats { padding: 8px 14px; font-size: 11px; color: var(--text3); border-bottom: 1px solid var(--border2); display: flex; gap: 8px; flex-wrap: wrap; }
.sidebar-list { flex: 1; overflow-y: auto; }
.sidebar-group-header { display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 11px; font-weight: 700; color: var(--text2); cursor: pointer; background: var(--bg2); border-bottom: 1px solid var(--border2); user-select: none; }
.sidebar-group-header:hover { background: var(--border2); }
.sidebar-group-header i { font-size: 12px; color: var(--text3); flex-shrink: 0; }
.sidebar-group-count { margin-left: auto; background: var(--card); border: 1px solid var(--border2); border-radius: 99px; padding: 0 7px; font-size: 10px; font-weight: 600; color: var(--text3); }
.sidebar-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border2); position: relative; transition: background .12s; }
.sidebar-item:hover { background: var(--bg2); }
.sidebar-item.active { background: #eef1fd; }
.sidebar-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary); }
.sidebar-item .avatar { width: 32px; height: 32px; font-size: 12px; flex-shrink: 0; }
.sidebar-item-info { flex: 1; min-width: 0; }
.sidebar-item-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.sidebar-item-sub { font-size: 11px; color: var(--text3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-overdue-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.sidebar-empty { padding: 2rem 1rem; text-align: center; color: var(--text3); font-size: 13px; line-height: 1.7; }

.main-panel { flex: 1; min-width: 0; overflow-y: auto; padding: 1.25rem 1.5rem 4rem; }

/* 客戶詳情：左側摘要卡 + 右側橫向分頁 */
.detail-body { display: flex; gap: 20px; align-items: flex-start; }
.detail-sidebar { width: 260px; flex-shrink: 0; background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 16px; }
.detail-main { flex: 1; min-width: 0; }
.summary-sec-title { font-size: 11px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 6px; }
.summary-sec-title:first-child { margin-top: 0; }
.summary-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border2); font-size: 13px; gap: 8px; }
.summary-row:last-child { border-bottom: none; }
.summary-label { color: var(--text3); font-size: 12px; flex-shrink: 0; }
.summary-val { font-weight: 600; color: var(--text); text-align: right; }
.quick-log-box { margin-top: 8px; }
.quick-log-input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; font-family: var(--font); margin-bottom: 6px; background: var(--card); color: var(--text); }
.quick-log-input:focus { outline: none; border-color: var(--primary); }
.quick-log-btn { width: 100%; }
.quick-log-preview { font-size: 11px; color: var(--text3); margin-top: 10px; line-height: 1.5; border-top: 1px dashed var(--border2); padding-top: 8px; }

@media(max-width:760px){
  .app-layout { flex-direction: column; }
  .sidebar-customers { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid var(--border2); }
  .detail-body { flex-direction: column; }
  .detail-sidebar { width: 100%; }
}

/* ════════════════════════════════
   Pipeline 頁
════════════════════════════════ */
#page-pipeline { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
.pipeline-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px; }
.pipeline-title { font-size: 19px; font-weight: 600; color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text2); font-family: var(--font); transition: all .12s; white-space: nowrap; }
.btn:hover { background: var(--bg2); }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--purple)); color: #fff; border: none; }
.btn-primary:hover { opacity: .9; }
.btn-sm { padding: 5px 11px; font-size: 12px; }

/* 今日提醒卡 */
.reminder-card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 1.25rem; }
.reminder-group { margin-bottom: 14px; }
.reminder-group:last-child { margin-bottom: 0; }
.reminder-group-title { font-size: 13px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px; }
.reminder-count { background: var(--bg2); border-radius: 99px; padding: 0 7px; font-size: 11px; font-weight: 600; color: var(--text3); }
.reminder-group-hint { font-size: 11px; color: var(--text3); margin: 2px 0 6px; }
.reminder-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.reminder-pill { background: var(--bg2); border: 1px solid var(--border2); border-radius: 99px; padding: 3px 12px; font-size: 12px; color: var(--text2); cursor: pointer; transition: all .12s; }
.reminder-pill:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.reminder-pill.tier-soon { background: #fff8e1; border-color: #ffe082; color: #e65100; }
.reminder-pill.tier-tomorrow { background: #fff3e0; border-color: #ffb74d; color: #e65100; font-weight: 600; }
.reminder-pill.tier-today { background: #ffebee; border-color: #ef5350; color: #c62828; font-weight: 700; }
.reminder-more { background: none; border: none; font-size: 12px; color: var(--text3); cursor: pointer; text-decoration: underline; padding: 3px 4px; }

/* 業績目標卡 */
.goals-card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 1.25rem; }
.goals-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.goals-card-title { font-size: 13px; font-weight: 700; color: var(--text2); }
.goals-row { margin-bottom: 12px; }
.goals-row:last-child { margin-bottom: 0; }
.goals-label { font-size: 12px; color: var(--text3); margin-bottom: 4px; }
.goals-bar-wrap { width: 100%; height: 8px; background: var(--bg2); border-radius: 99px; overflow: hidden; margin-bottom: 4px; }
.goals-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #8b7ee8); border-radius: 99px; transition: width .2s; }
.goals-nums { font-size: 13px; font-weight: 600; color: var(--text); }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.25rem; }
.stat-card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px; text-align: center; }
.stat-num { font-size: 22px; font-weight: 600; }
.stat-num.primary { color: var(--primary); }
.stat-num.green { color: var(--green); }
.stat-num.red { color: var(--red); }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* 搜尋篩選 */
.search-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.search-input { flex: 1; min-width: 160px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; background: var(--card); color: var(--text); font-family: var(--font); }
.search-input:focus { outline: none; border-color: var(--primary); }
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 11px; border-radius: 99px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); transition: all .12s; user-select: none; }
.chip.on-all { background: var(--primary); color: #fff; border-color: var(--primary); }
.chip.on-接觸中 { background: #fce4ec; color: #880e4f; border-color: #f48fb1; }
.chip.on-建立信任 { background: #fff8e1; color: #e65100; border-color: #ffe082; }
.chip.on-推進中 { background: #ede7f6; color: #4527a0; border-color: #b39ddb; }
.chip.on-成交談判 { background: #e3f2fd; color: #0d47a1; border-color: #90caf9; }
.chip.on-已簽約 { background: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; }
.chip.on-暫緩跟進 { background: #f5f5f5; color: #555; border-color: #bbb; }

/* 客戶列表 */
.cust-list { display: flex; flex-direction: column; gap: 8px; }
.cust-card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: box-shadow .15s; }
.cust-card:hover { box-shadow: 0 2px 12px rgba(102,126,234,.15); }
.cust-card.overdue { border-left: 3px solid var(--red); }
.cust-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; position: relative; }
.av-dot { position: absolute; top: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); border: 2px solid var(--card); }
.cust-info { flex: 1; min-width: 0; }
.cust-name { font-size: 14px; font-weight: 600; }
.cust-co { font-size: 12px; color: var(--text3); margin-top: 1px; }
.cust-preview { font-size: 12px; color: var(--text3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
.cust-preview.urgent { color: var(--red); }
.cust-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.badge { font-size: 11px; padding: 2px 9px; border-radius: 99px; white-space: nowrap; font-weight: 500; }
.badge-接觸中 { background: #fce4ec; color: #880e4f; }
.badge-建立信任 { background: #fff8e1; color: #e65100; }
.badge-推進中 { background: #ede7f6; color: #4527a0; }
.badge-成交談判 { background: #e3f2fd; color: #0d47a1; }
.badge-已簽約 { background: #e8f5e9; color: #1b5e20; }
.badge-暫緩跟進 { background: #f5f5f5; color: #555; }
.badge-A { background: #ede7f6; color: #4527a0; }
.badge-B { background: #e3f2fd; color: #0d47a1; }
.badge-C { background: #f5f5f5; color: #555; }
.badge-Q1 { background: #fff8e1; color: #e65100; }
.badge-Q2 { background: #e8f5e9; color: #1b5e20; }
.badge-Q3 { background: #fce4ec; color: #880e4f; }
.badge-Q4 { background: #e3f2fd; color: #0d47a1; }
.cust-last { font-size: 11px; color: var(--text3); }

.empty-state { text-align: center; padding: 3rem; color: var(--text3); }
.empty-state i { font-size: 42px; display: block; margin-bottom: 12px; opacity: .3; }
.empty-state p { font-size: 14px; }

/* 推進提醒 Banner */
.overdue-banner { background: #fff5f5; border: 1px solid #ffc9c9; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 1rem; font-size: 13px; color: #c0392b; display: flex; align-items: center; gap: 8px; }

/* ════════════════════════════════
   客戶詳情頁
════════════════════════════════ */
#page-customer { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
.cust-page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.back-btn { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--primary); cursor: pointer; background: none; border: none; font-family: var(--font); padding: 0; }
.back-btn:hover { opacity: .75; }
.cust-page-title { font-size: 18px; font-weight: 600; }
.cust-page-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.cust-page-actions { margin-left: auto; display: flex; gap: 6px; }

/* 階段進度條 */
.stage-bar-wrap { margin-bottom: 1.25rem; }
.stage-bar { display: flex; align-items: center; }
.stage-step { display: flex; flex-direction: column; align-items: center; flex: 1; cursor: pointer; position: relative; }
.stage-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--card); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text3); transition: all .15s; z-index: 1; }
.stage-step.done .stage-dot { background: var(--primary); border-color: var(--primary); color: #fff; }
.stage-step.current .stage-dot { background: #fff; border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 4px rgba(102,126,234,.15); }
.stage-step.paused .stage-dot { background: var(--bg2); border-color: #bbb; color: #888; }
.stage-line { flex: 1; height: 2px; background: var(--border); margin: 0 -1px; align-self: flex-start; margin-top: 10px; }
.stage-line.done { background: var(--primary); }
.stage-pct { font-size: 10px; color: var(--text3); margin-top: 4px; font-weight: 600; }
.stage-step.done .stage-pct, .stage-step.current .stage-pct { color: var(--primary); }
.stage-label { font-size: 11px; color: var(--text3); margin-top: 2px; white-space: nowrap; }
.stage-step.done .stage-label, .stage-step.current .stage-label { color: var(--text); font-weight: 500; }
.stage-paused-tag { text-align: center; font-size: 11px; color: #888; margin-top: 8px; background: var(--bg2); border-radius: 99px; padding: 3px 10px; display: inline-block; }
.stage-paused-wrap { text-align: center; }

/* Tabs */
.tab-nav { display: flex; border-bottom: 1px solid var(--border2); margin-bottom: 1.25rem; gap: 0; overflow-x: auto; scrollbar-width: none; }
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn { padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--text3); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-family: var(--font); transition: all .12s; }
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-warn-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-left: 4px; vertical-align: middle; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* 共用 section */
.sec { margin-bottom: 1.25rem; }
.sec-title { font-size: 11px; font-weight: 600; color: var(--primary); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
.field-group { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; }
.field-row { display: flex; border-bottom: 1px solid var(--border2); }
.field-row:last-child { border-bottom: none; }
.field-label { font-size: 12px; color: var(--text2); padding: 10px 14px; min-width: 120px; background: var(--bg2); font-weight: 500; display: flex; align-items: center; }
.field-val { font-size: 13px; color: var(--text); padding: 10px 14px; flex: 1; }
.field-input { font-size: 13px; color: var(--text); padding: 9px 14px; flex: 1; border: none; background: transparent; font-family: var(--font); }
.field-input:focus { outline: none; background: #fafbff; }
.field-select { font-size: 13px; color: var(--text); padding: 9px 14px; flex: 1; border: none; background: transparent; font-family: var(--font); }
.field-select:focus { outline: none; }
.field-textarea { font-size: 13px; color: var(--text); padding: 9px 14px; flex: 1; border: none; background: transparent; font-family: var(--font); resize: vertical; min-height: 70px; }
.field-textarea:focus { outline: none; }

/* 狀態按鈕 */
.status-btns { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px; }
.s-btn { padding: 4px 12px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--bg2); color: var(--text2); font-family: var(--font); transition: all .12s; }
.s-btn.sel-接觸中 { background: #fce4ec; color: #880e4f; border-color: #f48fb1; font-weight: 600; }
.s-btn.sel-建立信任 { background: #fff8e1; color: #e65100; border-color: #ffe082; font-weight: 600; }
.s-btn.sel-推進中 { background: #ede7f6; color: #4527a0; border-color: #b39ddb; font-weight: 600; }
.s-btn.sel-成交談判 { background: #e3f2fd; color: #0d47a1; border-color: #90caf9; font-weight: 600; }
.s-btn.sel-已簽約 { background: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; font-weight: 600; }
.s-btn.sel-暫緩跟進 { background: #f5f5f5; color: #555; border-color: #bbb; font-weight: 600; }

/* 診斷狀態切換：推進中/卡住/PoC中 */
.dstate-btns { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px; }
.dstate-btn { padding: 4px 14px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--bg2); color: var(--text2); font-family: var(--font); transition: all .12s; }
.dstate-btn.sel-推進中 { background: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; font-weight: 600; }
.dstate-btn.sel-卡住 { background: #ffebee; color: #b71c1c; border-color: #ef9a9a; font-weight: 600; }
.dstate-btn.sel-PoC中 { background: #e3f2fd; color: #0d47a1; border-color: #90caf9; font-weight: 600; }

/* ABC */
.abc-btns { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px; }
.abc-btn { padding: 4px 14px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--bg2); color: var(--text2); font-family: var(--font); transition: all .12s; }
.abc-btn.sel-A { background: #ede7f6; color: #4527a0; border-color: #b39ddb; font-weight: 600; }
.abc-btn.sel-B { background: #e3f2fd; color: #0d47a1; border-color: #90caf9; font-weight: 600; }
.abc-btn.sel-C { background: #f5f5f5; color: #555; border-color: #bbb; font-weight: 600; }

/* 卡點 checkbox */
.check-group { padding: 10px 14px; display: flex; flex-direction: column; gap: 7px; }
.check-item { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check-item input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }

/* 系統建議 */
.rec-box { background: linear-gradient(135deg, #eef2ff, #f5f0ff); border: 1px solid #c5cff8; border-radius: var(--radius); padding: 14px 16px; margin-top: 1rem; }
.rec-label { font-size: 11px; font-weight: 600; color: var(--primary); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
.rec-text { font-size: 14px; color: var(--text); line-height: 1.6; }
.rec-action { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.rec-btn { padding: 7px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--primary); color: var(--primary); background: transparent; font-family: var(--font); }
.rec-btn:hover { background: var(--primary); color: #fff; }
.rec-btn.primary { background: var(--primary); color: #fff; }

/* 象限評分 */
.score-row { display: flex; gap: 16px; padding: 10px 14px; align-items: center; flex-wrap: wrap; }
.score-item { display: flex; align-items: center; gap: 8px; }
.score-label { font-size: 12px; color: var(--text2); }
.score-input { width: 58px; padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--card); color: var(--text); text-align: center; font-family: var(--font); }
.score-input:focus { outline: none; border-color: var(--primary); }

/* 收款 */
.payment-summary { display: flex; gap: 16px; padding: 10px 14px; background: #e8f4f8; border-radius: var(--radius); margin-bottom: 10px; flex-wrap: wrap; }
.psummary-item { font-size: 13px; color: var(--text2); }
.psummary-item strong { font-weight: 600; }
.psummary-item.green strong { color: var(--green); }
.psummary-item.orange strong { color: var(--orange); }
.inv-mode-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.inv-btn { padding: 5px 13px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--card); color: var(--text2); font-family: var(--font); }
.inv-btn.sel { background: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; font-weight: 600; }
.pay-row { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
.pay-row-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pay-toggle { display: flex; border: 1px solid var(--border); border-radius: 99px; overflow: hidden; font-size: 12px; }
.pay-toggle-btn { padding: 3px 11px; cursor: pointer; background: var(--bg2); color: var(--text2); border: none; font-family: var(--font); }
.pay-toggle-btn.invoiced { background: #e8f5e9; color: #1b5e20; font-weight: 600; }
.pay-toggle-btn.not-inv { background: #fff8e1; color: #e65100; font-weight: 600; }
.pay-meta { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.pay-meta-label { font-size: 12px; color: var(--text3); }
.pay-date-input, .pay-amt-input { padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; background: var(--card); color: var(--text); font-family: var(--font); }
.pay-amt-input { width: 120px; }
.pay-date-input:focus, .pay-amt-input:focus { outline: none; border-color: var(--primary); }
.collected-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.collected-cb { width: 15px; height: 15px; accent-color: var(--green); cursor: pointer; }
.collected-lbl { font-size: 12px; color: var(--text2); cursor: pointer; }
.collected-lbl.yes { color: var(--green); font-weight: 600; }
.btn-add-pay { margin-top: 8px; padding: 5px 12px; border: 1px dashed var(--border); border-radius: var(--radius); font-size: 12px; cursor: pointer; background: transparent; color: var(--text3); font-family: var(--font); }
.btn-add-pay:hover { color: var(--primary); border-color: var(--primary); }

/* 日誌 */
.log-entry { border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; background: var(--bg2); }
.log-entry.today { border-left: 3px solid var(--red); }
.log-view { display: flex; gap: 10px; }
.log-date { font-size: 11px; color: var(--text3); min-width: 82px; padding-top: 2px; display: flex; align-items: center; gap: 4px; }
.log-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.log-text { flex: 1; font-size: 13px; color: var(--text); line-height: 1.6; word-break: break-word; }
.log-actions { display: flex; gap: 2px; }
.log-btn { background: none; border: none; cursor: pointer; padding: 3px 5px; border-radius: 4px; font-size: 15px; color: var(--text3); }
.log-btn:hover { color: var(--text); }
.log-btn.del:hover { color: var(--red); }
.log-edit { display: none; margin-top: 8px; }
.log-edit.open { display: block; }
.log-edit-ta { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--card); color: var(--text); resize: vertical; min-height: 60px; font-family: var(--font); }
.log-edit-ta:focus { outline: none; border-color: var(--primary); }
.log-edit-row { display: flex; gap: 6px; margin-top: 7px; align-items: center; flex-wrap: wrap; }
.log-date-input { padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; background: var(--card); color: var(--text); font-family: var(--font); }
.btn-save-log { padding: 5px 14px; border: none; border-radius: var(--radius); background: var(--primary); color: #fff; font-size: 12px; cursor: pointer; font-weight: 500; font-family: var(--font); }
.btn-cancel-log { padding: 5px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text2); font-size: 12px; cursor: pointer; font-family: var(--font); }
.log-add-row { display: flex; gap: 8px; margin-top: 8px; }
.log-input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--card); color: var(--text); font-family: var(--font); }
.log-input:focus { outline: none; border-color: var(--primary); }
.btn-log { padding: 8px 14px; border: none; border-radius: var(--radius); background: var(--primary); color: #fff; font-size: 13px; cursor: pointer; font-weight: 500; font-family: var(--font); }
.log-hint { font-size: 11px; color: var(--text3); margin-top: 6px; }

.card-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border2); }

/* ════════════════════════════════
   Modal
════════════════════════════════ */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 1.5rem; width: 400px; max-width: 94vw; max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; color: var(--text); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; background: var(--bg2); color: var(--text); font-family: var(--font); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); }
.field-hint { font-size: 11px; color: var(--text3); margin-top: 5px; line-height: 1.5; }
.modal-btns { display: flex; gap: 8px; margin-top: 1.25rem; }
.btn-confirm { flex: 1; padding: 9px; border: none; border-radius: var(--radius); background: linear-gradient(135deg, var(--primary), var(--purple)); color: #fff; font-size: 14px; cursor: pointer; font-weight: 600; font-family: var(--font); }
.btn-cancel-modal { flex: 1; padding: 9px; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text); font-size: 14px; cursor: pointer; font-family: var(--font); }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--primary), var(--purple)); color: #fff; font-size: 13px; padding: 10px 22px; border-radius: 99px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; font-weight: 500; white-space: nowrap; }
.toast.show { opacity: 1; }

/* ── Responsive ── */
@media(max-width:640px){
  input,select,textarea{font-size:16px!important;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .cust-right{flex-direction:row;align-items:center;gap:5px;flex-wrap:wrap;}
  .tab-btn{padding:8px 12px;font-size:12px;}
  #page-pipeline,#page-customer{padding:1rem .75rem 4rem;}
}
@media(pointer:coarse){
  .s-btn,.abc-btn,.chip,.inv-btn,.pay-toggle-btn{min-height:32px;display:inline-flex;align-items:center;}
  .log-btn{padding:6px 8px;font-size:18px;}
  .collected-cb{width:18px;height:18px;}
}
</style>

<script>

const PWD = 'BDS';
const TODAY = new Date().toISOString().slice(0,10);
(function setTopbarDate(){
  const d = new Date();
  const wd = ['日','一','二','三','四','五','六'][d.getDay()];
  const el = document.getElementById('topbar-date');
  if(el) el.textContent = `${d.getMonth()+1}月${d.getDate()}日（週${wd}）`;
})();
const STATUSES = ['接觸中','建立信任','推進中','成交談判','已簽約','暫緩跟進'];
const INV_MODES = ['60% 頭款 & 40% 尾款','結案後付款','自訂'];
const Q_DESC = {Q1:'觀望型｜降頻維護',Q2:'快速贏｜全力加碼',Q3:'直接放｜最後通牒',Q4:'戰略型｜3問快篩'};
const Q_DESC_FULL = {
  Q1:'可能性低、成本也低：不用花太多力氣主動推，定期簡單維護即可，不用完全放棄',
  Q2:'可能性高、成本低：最容易拿下的案子，值得全力加碼、優先處理',
  Q3:'可能性低、成本高：投入下去不划算，設個停損點，最後通牒後準備放掉',
  Q4:'可能性高、成本也高：值得投資，但先用三個關鍵問題快篩，避免盲目砸資源'
};
const AV_COLORS = [
  ['#e8eaf6','#3949ab'],['#e8f5e9','#2e7d32'],['#fff3e0','#e65100'],
  ['#fce4ec','#880e4f'],['#e3f2fd','#1565c0'],['#f3e5f5','#6a1b9a'],['#e0f2f1','#00695c']
];

const avatarColor = name => AV_COLORS[name.charCodeAt(0)%AV_COLORS.length];
const calcQ = (p,c) => { const pv=parseFloat(p)||0,cv=parseFloat(c)||0; if(!pv&&!cv)return''; if(pv>=4&&cv<=3)return'Q2'; if(pv>=4&&cv>=4)return'Q4'; if(pv<=3&&cv<=3)return'Q1'; return'Q3'; };
const calcCollected = c => (c.invoice?.payments||[]).reduce((s,p)=>s+(p.collected?parseFloat(p.amount)||0:0),0);
const lastLogDate = c => c.logs?.length ? c.logs.slice().sort((a,b)=>b.date.localeCompare(a.date))[0].date : null;
const daysSince = d => d ? Math.floor((new Date()-new Date(d))/864e5) : 999;
const isOverdue = c => !['已簽約','暫緩跟進'].includes(c.status) && daysSince(lastLogDate(c)) >= 7;
const hasTodayLog = c => (c.logs||[]).some(l => { const m=l.text.match(/(\d{4}[-\/]\d{1,2}[-\/]\d{1,2}|\d{1,2}[-\/]\d{1,2})/g)||[]; return m.some(s=>{ const pts=s.split(/[-\/]/); const d=pts.length===3?`${pts[0].padStart(4,'20')}-${pts[1].padStart(2,'0')}-${pts[2].padStart(2,'0')}`:`${new Date().getFullYear()}-${pts[0].padStart(2,'0')}-${pts[1].padStart(2,'0')}`; return d===TODAY; }); });

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ══════════════════════════════════════
// 登入
// ══════════════════════════════════════
function doLogin(){
  const v = document.getElementById('pwd-input').value.trim().toUpperCase();
  if(v !== PWD){
    const el = document.getElementById('pwd-input');
    el.classList.add('error');
    document.getElementById('login-err').textContent = '密語不正確，請向講師確認';
    setTimeout(()=>{ el.classList.remove('error'); el.value=''; },600);
    return;
  }
  sessionStorage.setItem('bds_auth','1');
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  updateDemoModeUI();
  showOverview();
}
function logout(){
  if(!confirm('確定登出？'))return;
  sessionStorage.removeItem('bds_auth');
  document.getElementById('screen-main').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('pwd-input').value='';
  document.getElementById('login-err').textContent='';
}

function seedDemoGoals(){
  const y = new Date().getFullYear();
  const q = Math.floor(new Date().getMonth()/3)+1;
  return { annual:{[String(y)]:12000000}, quarterly:{[`${y}-Q${q}`]:3000000} };
}
// 示範資料版本號：每次改動 seedDemoData() 的內容就要更新這個版本號，
// 不然瀏覽器裡舊版的示範資料會一直被沿用，看不到最新欄位（例如這次新增的 siPartner）
const DEMO_DATA_VERSION = 'v6-logic-fix';
function toggleDemoMode(){
  if(!demoMode){
    if(!confirm('切換到示範模式：畫面會換成假資料，適合投影展示。你的真實客戶資料不會受影響，之後可以隨時切回來。要切換嗎？')) return;
  } else {
    if(!confirm('切回真實模式：畫面會換回你自己的客戶資料。要切換嗎？')) return;
  }
  demoMode = !demoMode;
  localStorage.setItem('bds_mode', demoMode ? 'demo' : 'real');
  customers = JSON.parse(localStorage.getItem(customersKey())||'[]');
  const storedVersion = localStorage.getItem('bds_demo_version');
  if(demoMode && (customers.length===0 || storedVersion!==DEMO_DATA_VERSION)){
    customers = seedDemoData();
    save();
    localStorage.setItem('bds_demo_version', DEMO_DATA_VERSION);
  }
  nextId = customers.length ? Math.max(...customers.map(c=>c.id))+1 : 1;
  goals = JSON.parse(localStorage.getItem(goalsKey())||'{}');
  if(demoMode && (!goals.annual && !goals.quarterly || storedVersion!==DEMO_DATA_VERSION)){
    goals = seedDemoGoals();
    saveGoals();
  }
  currentCustomerId = null;
  goalsEditMode = false;
  updateDemoModeUI();
  showOverview();
  showToast(demoMode ? '✓ 已切換到示範模式（假資料）' : '✓ 已切回真實模式');
}
function updateDemoModeUI(){
  const badge = document.getElementById('mode-badge');

  if(badge) badge.textContent = demoMode ? '示範模式' : '個人版';
  if(btn) btn.title = demoMode ? '切回真實資料' : '切換到示範模式';

}

let demoMode = localStorage.getItem('bds_mode') === 'demo';
function customersKey(){ return demoMode ? 'bds_demo_v1' : 'bds_v1'; }
function goalsKey(){ return demoMode ? 'bds_demo_goals' : 'bds_goals'; }

let customers = JSON.parse(localStorage.getItem(customersKey())||'[]');

function getYearKey(d){ return String(new Date(d).getFullYear()); }
function getQuarterKey(d){ const dt=new Date(d); const q=Math.floor(dt.getMonth()/3)+1; return `${dt.getFullYear()}-Q${q}`; }
function saveGoals(){ localStorage.setItem(goalsKey(), JSON.stringify(goals)); }
function computeAchieved(){
  const curYear = getYearKey(TODAY), curQKey = getQuarterKey(TODAY);
  let yearAmt=0, qAmt=0;
  customers.forEach(c=>{
    if(c.status==='已簽約' && c.signedDate){
      if(getYearKey(c.signedDate)===curYear) yearAmt+=(c.amount||0);
      if(getQuarterKey(c.signedDate)===curQKey) qAmt+=(c.amount||0);
    }
  });
  return { yearAmt, qAmt, curYear, curQKey };
}
function toggleGoalsEdit(){ goalsEditMode = !goalsEditMode; renderOverview(); }
function saveGoalsInput(){
  const annualVal = parseFloat(document.getElementById('goal-annual').value)||0;
  const qVal = parseFloat(document.getElementById('goal-quarter').value)||0;
  const { curYear, curQKey } = computeAchieved();
  if(!goals.annual) goals.annual = {};
  if(!goals.quarterly) goals.quarterly = {};
  goals.annual[curYear] = annualVal;
  goals.quarterly[curQKey] = qVal;
  saveGoals();
  goalsEditMode = false;
  renderOverview();
}
function computeTodayReminders(){
  const needFollow = customers.filter(isOverdue);
  const QUADRANT_TIER = { Q2:0, Q4:1, Q1:2, Q3:3 };
  needFollow.sort((a,b)=>{
    const qa = calcQ(a.prob, a.cost), qb = calcQ(b.prob, b.cost);
    const ta = QUADRANT_TIER[qa] ?? 4, tb = QUADRANT_TIER[qb] ?? 4;
    if(ta !== tb) return ta - tb;
    return daysSince(lastLogDate(b)) - daysSince(lastLogDate(a));
  });
  const needCold = customers.filter(coldNeedsAttention);
  const pocDue = customers.filter(c=>{
    if(c.diagState!=='PoC中' || !c.diagPoC || !c.diagPoC.endDate) return false;
    const days = Math.ceil((new Date(c.diagPoC.endDate) - new Date(TODAY)) / 86400000);
    return days <= 3;
  });
  const needInvoice = customers.filter(c=>{
    return c.status==='已簽約' && c.invoice && c.invoice.payments && c.invoice.payments.some(p=>!p.invoiced);
  });
  const needQuote = customers.filter(c=>{
    return STAGE_FLOW.indexOf(c.status) >= STAGE_FLOW.indexOf('推進中') && !(c.quote && c.quote.date);
  });
  const needDM = customers.filter(c=>{
    return c.diagDM===false && ['推進中','成交談判'].includes(c.status);
  });
  const meetingSoon = customers.filter(c=>{
    if(!c.nextMeeting || !c.nextMeeting.at) return false;
    const diffDays = Math.ceil((new Date(c.nextMeeting.at) - new Date()) / 86400000);
    return diffDays <= 3 && diffDays >= 0;
  }).sort((a,b)=> new Date(a.nextMeeting.at) - new Date(b.nextMeeting.at));
  return { needFollow, needCold, pocDue, needInvoice, needQuote, needDM, meetingSoon };
}

const needsMeetingNote = c => ['推進中','成交談判','已簽約'].includes(c.status) && !(c.nextMeeting && c.nextMeeting.at);
function formatMeetingTime(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ── SI 通路佔比 ──
// Roy 的交易模型是「Roy → SI → 終端客戶」，每筆案子都掛在某一家 SI 底下，
// 這裡把客戶依 c.siPartner 分組，算出每家 SI 目前握有多少商機、實際貢獻多少
// 已簽約營收，用來看通路依賴度（例如某家 SI 佔比過高，代表過度依賴單一通路）
function computeSIRevenue(){
  const groups = {};
  customers.forEach(c=>{
    const key = c.siPartner?.trim() || '未填寫';
    if(!groups[key]) groups[key] = { name:key, dealCount:0, pipelineAmt:0, signedAmt:0, collectedAmt:0, customers:[] };
    groups[key].dealCount++;
    if(c.status!=='暫緩跟進') groups[key].pipelineAmt += (c.amount||0);
    if(c.status==='已簽約'){
      groups[key].signedAmt += (c.amount||0);
      groups[key].collectedAmt += calcCollected(c);
    }
    groups[key].customers.push(c);
  });
  const list = Object.values(groups);
  const totalSigned = list.reduce((s,g)=>s+g.signedAmt,0);
  const totalPipeline = list.reduce((s,g)=>s+g.pipelineAmt,0);
  list.forEach(g=>{ g.signedPct = totalSigned ? Math.round(g.signedAmt/totalSigned*100) : 0; });
  // 排序依據：已有簽約營收的話依營收排序，否則（案子都還沒簽約時）依 Pipeline 商機大小排序，
  // 不然全部案子都還沒成交時，排序會因為大家都是 0% 而失去意義
  list.sort((a,b)=> totalSigned ? b.signedAmt-a.signedAmt : b.pipelineAmt-a.pipelineAmt);
  return { list, totalSigned, totalPipeline };
}

function getRecommendation(c){
  const stage = c.status;
  const stuck = (c.diagStuck||[]);
  const dmOk = c.diagDM;
  const over2w = c.diagOver2W;
  const q = calcQ(c.prob,c.cost);

  if(stage==='接觸中'){
    if(!c.diagResearch) return { text:'還沒做客戶研究。先去了解對方的產業、痛點，再寫陌開信。', tab:'陌開', action:'去填陌開框架' };
    return { text:'已有研究基礎，現在寫出 3 句話陌開信，確認 WIIFT 再發出。', tab:'陌開', action:'開始寫陌開信' };
  }
  if(stage==='建立信任'){
    if(stuck.includes('客戶有興趣但沒急迫性')) return { text:'客戶有興趣但沒急迫性。你需要幫他找到「現在就決定」的理由——季末預算、競品動態、或內部痛點加劇。', tab:'推進', action:'設計推進計畫' };
    return { text:'繼續建立信任。每次互動要有「小收穫」——一個確認、一個問題的解答、一個共識。', tab:'日誌', action:'記錄今天互動' };
  }
  if(stage==='推進中'){
    if(!dmOk) return { text:'⚠ 還沒接觸到決策者。現在最重要的事不是繼續推，是找到真正能拍板的人。', tab:'推進', action:'設計推進計畫' };
    if(over2w) return { text:'卡超過 2 週了。用工具表 C 的三個問題（決策者 / 決策壓力 / 內部反對者）重新診斷，然後設計接下來 2 週的推進節奏。', tab:'推進', action:'重新設計推進計畫' };
    return { text:'案子在推進中，維持節奏。記得每次互動結束都要確認「下一步是什麼、誰負責、什麼時間」。', tab:'推進', action:'查看推進計畫' };
  }
  if(stage==='成交談判'){
    if(stuck.includes('價格/條款談不攏')) return { text:'價格卡住了。先確認「對方是真的嫌貴，還是還沒被說服」——可以問：如果價格不是問題，你還有什麼顧慮？', tab:'診斷', action:'更新診斷' };
    if(stuck.includes('決策流程拖延')) return { text:'決策流程拖延。準備一份讓 Contact 可以直接轉給老闆的一頁紙，幫他降低內部推銷的難度。', tab:'推進', action:'設計推進計畫' };
    return { text:'進入成交談判，專注在「讓對方做決定」。給具體選項，不給開放式問題。', tab:'日誌', action:'記錄今天進展' };
  }
  if(stage==='已簽約') return { text:'恭喜簽約！記得追蹤收款進度，並且想想這個客戶能不能成為下一個 case study 或引薦來源。', tab:'收款', action:'更新收款狀態' };
  if(stage==='暫緩跟進'){
    if(q==='Q3') return { text:'這個客戶在象限 3（低可能性 + 高成本）。考慮給一次「最後通牒」——直接問能不能定下一步，沒有回應就正式停損。', tab:'優先度', action:'評估是否繼續' };
    return { text:'暫緩跟進中。每月 check-in 一次，保持存在感。等對方有新動態再重新評估要不要加碼。', tab:'日誌', action:'設提醒' };
  }
  return { text:'繼續加油！記得每次互動後更新日誌，讓系統幫你追蹤節奏。', tab:'日誌', action:'記錄互動' };
}

// ── 推進計畫建議（依三個關鍵問題的答案，給 junior BD 預設行動方向；仍可自行編輯覆蓋）──
// 判斷優先順序：決策者未接觸 > 有內部反對者 > 無決策壓力 > 一路順
// 三題都要有明確答案才給對應建議組，避免只填一半就提早誤判
function pushPlanSuggest(c){
  const dm = c.pushDM, pr = c.pushPressure, op = c.pushOpponent;
  const answered = v => v===true || v===false;

  if(!answered(dm)) return null;
  if(dm===false){
    return ['透過現有窗口，直接問「這件事最後是誰拍板？」','嘗試約到決策者，用「10 分鐘簡短交流」降低門檻','若還沒約到，請窗口先把資料轉給決策者，附上具體效益','重新評估：決策者仍接觸不到就考慮降頻'];
  }
  // dm === true，決策者已接觸，接下來看反對者
  if(!answered(op)) return null;
  if(op===true){
    return ['約窗口聊，了解反對者在意什麼，協助準備資訊幫忙說服內部','根據反對者的疑慮準備對應資料（成本、風險、比較）','主動詢問內部討論進度，適時補充案例或佐證','若反對意見仍未化解，評估要不要直接跟反對者對話'];
  }
  // op === false，無反對者，接下來看決策壓力
  if(!answered(pr)) return null;
  if(pr===false){
    return ['分享同業案例或市場動態，建立「現在不做」的機會成本','了解對方年度預算或計畫時程，找到可能的時間點','提出限時誘因（優惠、資源、名額），創造決策誘因','若仍無壓力，考慮降低優先度，改為定期維護'];
  }
  return ['直接確認下一步：提案/報價/簽約，並約定具體時間','準備正式提案或合約，確認流程與所需文件','跟進進度，確認是否有新的疑慮浮現','推進簽約，準備收款與交接事項'];
}

// ── 階段進度條 ──
const STAGE_FLOW = ['接觸中','建立信任','推進中','成交談判','已簽約'];

// 陌開資料是否為空 —— 用來判斷「案子已經推進，但陌開研究還沒填」要不要提醒
function isColdEmpty(c){
  return !c.coldTarget && !c.coldBiz && !c.coldPain && !c.coldValue && !c.coldS1 && !c.coldS2 && !c.coldS3;
}
// 案子是否已經過了「建立信任」階段，卻還沒填陌開資料 —— 用來在分頁標籤上顯示警示點
function coldNeedsAttention(c){
  const idx = STAGE_FLOW.indexOf(c.status);
  return idx >= 2 && isColdEmpty(c); // idx 2 = 推進中（含）以後
}
const STAGE_PCT = {'接觸中':10,'建立信任':25,'推進中':50,'成交談判':75,'已簽約':100};

function stageBarHTML(c){
  // 暫緩跟進：顯示灰階「暫停於 XX 階段」，不走一般進度條
  if(c.status==='暫緩跟進'){
    const last = c.pausedAt || '建立信任'; // 停在哪個階段的記憶，預設抓建立信任
    return `
    <div class="stage-bar-wrap stage-paused-wrap">
      <div class="stage-bar">
        ${STAGE_FLOW.map((s,i)=>{
          const idx = STAGE_FLOW.indexOf(last);
          const cls = i<=idx ? 'paused' : '';
          return `
          <div class="stage-step ${cls}" onclick="setField(${c.id},'status','${s}')">
            <div class="stage-dot">${i<=idx?'—':STAGE_PCT[s]}</div>
            <div class="stage-pct">${STAGE_PCT[s]}%</div>
            <div class="stage-label">${s}</div>
          </div>
          ${i<STAGE_FLOW.length-1?`<div class="stage-line ${i<idx?'done':''}"></div>`:''}`;
        }).join('')}
      </div>
      <div class="stage-paused-tag">⏸ 暫緩跟進，停在「${last}」</div>
    </div>`;
  }

  const curIdx = STAGE_FLOW.indexOf(c.status);
  return `
  <div class="stage-bar-wrap">
    <div class="stage-bar">
      ${STAGE_FLOW.map((s,i)=>{
        let cls = '';
        if(i<curIdx) cls='done'; else if(i===curIdx) cls='current';
        return `
        <div class="stage-step ${cls}" onclick="setField(${c.id},'status','${s}')">
          <div class="stage-dot">${i<curIdx?'<i class=\"ti ti-check\"></i>':STAGE_PCT[s]}</div>
          <div class="stage-pct">${STAGE_PCT[s]}%</div>
          <div class="stage-label">${s}</div>
        </div>
        ${i<STAGE_FLOW.length-1?`<div class="stage-line ${i<curIdx?'done':''}"></div>`:''}`;
      }).join('')}
    </div>
  </div>`;
}

// ── 左側摘要卡 ──
// 欄位判斷依據（不是照搬 HubSpot 預設欄位，是照 Roy 自己的 SI 賦能診斷框架選的）：
// 1. 決策者已接觸：診斷框架裡最優先要確認的事，一般 CRM 不會有這格。
//    這裡指的是「終端客戶」的決策者，不是 SI ——配合的 SI 是每筆案子
//    本來就存在的通路夥伴（顯示在客戶抬頭），不是需要判斷是否認同的變數
// 2. 客戶分類 A/B/C、象限判斷：工作坊教材裡的優先度框架，決定該不該花時間
// 3. 上次追蹤天數：跟進節奏是否斷掉的警示
// 4. 快速記錄：日誌是最高頻的操作，直接放在摘要卡，不用切到日誌分頁才能記
function summaryCardHTML(c){
  const q = calcQ(c.prob,c.cost);
  const collected = calcCollected(c);
  const last = lastLogDate(c);
  const od = isOverdue(c);
  return `
  <div class="summary-sec-title">關鍵狀態</div>
  <div class="summary-row"><span class="summary-label">決策者已接觸</span><span class="summary-val" style="color:${c.diagDM===true?'var(--green)':c.diagDM===false?'var(--red)':'var(--text3)'}">${c.diagDM===true?'是':c.diagDM===false?'否':'未確認'}</span></div>
  <div class="summary-row"><span class="summary-label" title="A＝有需求+有預算+有時間表｜B＝有需求但預算或時程不確定｜C＝需求薄弱、多次接觸沒進展" style="cursor:help;border-bottom:1px dotted var(--text3);">客戶分類 <i class="ti ti-info-circle" style="font-size:11px;"></i></span><span class="summary-val">${c.abc?`${c.abc} 類`:'未分類'}</span></div>
  <div class="summary-row"><span class="summary-label">象限判斷</span><span class="summary-val" style="font-size:12px;${q?'cursor:help;border-bottom:1px dotted var(--text3);':''}" ${q?`title="${Q_DESC_FULL[q]}"`:''}>${q?`${q}｜${Q_DESC[q]||''}`:'未評分'}</span></div>
  <div class="summary-row"><span class="summary-label">上次追蹤</span><span class="summary-val" style="${od?'color:var(--red)':''}">${last?`${daysSince(last)} 天前`:'尚未追蹤'}</span></div>

  <div class="summary-sec-title">合約金額</div>
  <div class="summary-row"><span class="summary-label">合約總額</span><span class="summary-val">NT$ ${(c.amount||0).toLocaleString()}</span></div>
  <div class="summary-row"><span class="summary-label">已收 / 待收</span><span class="summary-val" style="font-size:12px;">${collected.toLocaleString()} / ${((c.amount||0)-collected).toLocaleString()}</span></div>

  <div class="summary-sec-title">快速記錄</div>
  <div class="quick-log-box">
    <input class="quick-log-input" id="qlog-${c.id}" type="text" placeholder="記錄這次互動…" onkeydown="if(event.key==='Enter')quickAddLog(${c.id})">
    <button class="btn btn-sm btn-primary quick-log-btn" onclick="quickAddLog(${c.id})"><i class="ti ti-plus"></i> 記錄</button>
    ${last?`<div class="quick-log-preview">最近："${(c.logs[0].text||'').slice(0,40)}"</div>`:''}
  </div>
  `;
}
function quickAddLog(id){
  const el = document.getElementById('qlog-'+id);
  if(!el || !el.value.trim()) return;
  const c = getC(id);
  if(!c.logs) c.logs = [];
  c.logs.unshift({id:nextLogId++, date:TODAY, text:el.value.trim()});
  c.updatedAt = TODAY;
  save();
  renderCustomer(id, currentActiveTab||'diag');
  renderSidebar();
  showToast('✓ 已記錄');
}

          <label style="display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;"><input type="radio" name="pp-${c.id}" value="0" ${c.pushPressure===false?'checked':''} onchange="setField(${c.id},'pushPressure',false)"> 否</label>

      <div class="field-row">

        <div style="display:flex;gap:8px;align-items:center;padding:8px 14px;">
          <label style="display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;"><input type="radio" name="po-${c.id}" value="1" ${c.pushOpponent===true?'checked':''} onchange="setField(${c.id},'pushOpponent',true)"> 是</label>
          <label style="display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;"><input type="radio" name="po-${c.id}" value="0" ${c.pushOpponent===false?'checked':''} onchange="setField(${c.id},'pushOpponent',false)"> 否</label>

    </div>

  <div class="sec">
    <div class="sec-title">2 週推進計畫${suggest?'<span style="font-weight:400;color:var(--text3);font-size:11px;margin-left:6px;">（已根據上面的回答帶入建議，仍可自行編輯）</span>':''}</div>
    <div class="field-group">

        </div>`).join('')}

  </div>

  ${contractPaymentHTML(c)}`;
}

// 合約 & 收款：從「優先度」拆出來的區塊。優先度只負責「值不值得投入」的判斷（象限評分），
// 合約金額/收款狀態是案子已經在推進、甚至已簽約後的財務追蹤，性質上更貼近「推進」這個 tab，
// 所以歸到這裡，接在 2 週推進計畫後面——推進到最後自然就是簽約收款。
function contractPaymentHTML(c){
  const collected = calcCollected(c);
  const remain = (c.amount||0) - collected;
  const inv = c.invoice || defaultInvoice();
  return `
  <div class="sec">
    <div class="sec-title">合約 & 收款</div>
    <div class="field-group">
      ${c.status==='已簽約'?`<div class="field-row"><span class="field-label">簽約日期</span><input class="field-input" type="date" value="${c.signedDate||''}" onchange="setField(${c.id},'signedDate',this.value)"></div>`:''}
      <div class="field-row"><span class="field-label">合約金額 NTD</span><input class="field-input" type="number" id="amt-${c.id}" value="${c.amount||''}" placeholder="0" onblur="saveAmount(${c.id})"></div>
    </div>
    ${c.amount?`
    <div class="payment-summary" style="margin-top:10px;">
      <div class="psummary-item">合約 <strong>NT$ ${Number(c.amount).toLocaleString()}</strong></div>
      <div class="psummary-item green">已收 <strong>NT$ ${Number(collected).toLocaleString()}</strong></div>
      <div class="psummary-item orange">待收 <strong>NT$ ${Number(remain).toLocaleString()}</strong></div>
    </div>
    <div class="inv-mode-row">
      ${INV_MODES.map(m=>`<button class="inv-btn${inv.mode===m?' sel':''}" onclick="setInvMode(${c.id},'${m}')">${m}</button>`).join('')}
    </div>
    ${inv.mode==='自訂'?`<input style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;margin-bottom:10px;font-family:var(--font);" value="${inv.customMode||''}" placeholder="自訂收款說明…" onblur="setField(${c.id},'invoice',{...getC(${c.id}).invoice,customMode:this.value})">`:''}
    ${(inv.payments||[]).map((p,pi)=>`
    <div class="pay-row">
      <div class="pay-row-header">
        <span style="font-size:13px;font-weight:600;min-width:50px;">${p.label}</span>
        <div class="pay-toggle">
          <button id="inv-o-${c.id}-${pi}" class="pay-toggle-btn${p.invoiced?' invoiced':''}" onclick="setInvoiced(${c.id},${pi},true)">已開票</button>
          <button id="inv-n-${c.id}-${pi}" class="pay-toggle-btn${!p.invoiced?' not-inv':''}" onclick="setInvoiced(${c.id},${pi},false)">未開票</button>
        </div>
        ${(inv.payments||[]).length>2?`<button style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;" onclick="removePayment(${c.id},${pi})"><i class="ti ti-trash"></i></button>`:''}
      </div>
      <div class="pay-meta">
        <span class="pay-meta-label">預計收款</span>
        <input class="pay-date-input" type="date" id="pay-d-${c.id}-${pi}" value="${p.incomeDate||''}" onchange="savePayField(${c.id},${pi},'incomeDate',this.value)">
        <span class="pay-meta-label">金額</span>
        <input class="pay-amt-input" type="number" id="pay-a-${c.id}-${pi}" value="${p.amount||''}" placeholder="0" onblur="savePayField(${c.id},${pi},'amount',this.value)">
      </div>
      <div class="collected-row">
        <input class="collected-cb" type="checkbox" id="cb-${c.id}-${pi}" ${p.collected?'checked':''} onchange="setCollected(${c.id},${pi})">
        <label id="cblbl-${c.id}-${pi}" class="collected-lbl${p.collected?' yes':''}" for="cb-${c.id}-${pi}">${p.collected?'✓ 已收款':'尚未收款'}</label>
      </div>
    </div>`).join('')}
    <button class="btn-add-pay" onclick="addPayment(${c.id})"><i class="ti ti-plus" style="font-size:12px;"></i> 新增款項</button>
    `:''}
  </div>`;
}

// ── 優先度 Tab ──
// 只留「值不值得投入」的判斷本身（象限評分＋3問快篩）。合約金額/收款狀態不屬於「優先度判斷」，
// 已經拆到「推進」tab 的 contractPaymentHTML() 裡了。
// ── 四象限圖 ──
// 拿掉「工具表 D」這個引用是因為不是每個學員都上過會用到那份講義的課，
// 這裡改用一張自己說得清楚的視覺圖，兩軸 + 四象限標籤 + 目前案子的位置標記，
// 不需要任何前情提要就能看懂。座標對應 calcQ() 的判斷邏輯：
// 可能性/成本 4-5 算高，1-3 算低，分界線畫在 3.5。
function quadrantChartHTML(prob, cost){
  const W=320, H=280, padL=48, padR=16, padT=16, padB=40;
  const gx0=padL, gx1=W-padR, gy0=padT, gy1=H-padB;
  // 分界線畫在跟 calcQ() 判斷邏輯完全一致的位置：閾值 3.5（1-5 分制中的 62.5%），
  // 不是幾何正中間——不然分數卡在 3 分附近時，視覺象限跟系統判斷的象限會對不上
  const threshRatio = (3.5-1)/4; // 0.625
  const midX = gx0 + threshRatio*(gx1-gx0);
  const midY = gy1 - threshRatio*(gy1-gy0);
  const hasScore = prob && cost;
  const px = hasScore ? gx0 + (Math.min(Math.max(cost,1),5)-1)/4*(gx1-gx0) : 0;
  const py = hasScore ? gy1 - (Math.min(Math.max(prob,1),5)-1)/4*(gy1-gy0) : 0;
  return `
  <div style="background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:380px;display:block;margin:0 auto;font-family:var(--font);">
      <!-- 四象限背景色塊 -->
      <rect x="${gx0}" y="${gy0}" width="${midX-gx0}" height="${midY-gy0}" fill="#e8f5e9"/>
      <rect x="${midX}" y="${gy0}" width="${gx1-midX}" height="${midY-gy0}" fill="#e3f2fd"/>
      <rect x="${gx0}" y="${midY}" width="${midX-gx0}" height="${gy1-midY}" fill="#fff8e1"/>
      <rect x="${midX}" y="${midY}" width="${gx1-midX}" height="${gy1-midY}" fill="#fce4ec"/>
      <!-- 象限標籤 -->
      <text x="${(gx0+midX)/2}" y="${(gy0+midY)/2-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">Q2 快速贏</text>
      <text x="${(gx0+midX)/2}" y="${(gy0+midY)/2+10}" text-anchor="middle" font-size="10" fill="#1b5e20">全力加碼</text>
      <text x="${(midX+gx1)/2}" y="${(gy0+midY)/2-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">Q4 戰略型</text>
      <text x="${(midX+gx1)/2}" y="${(gy0+midY)/2+10}" text-anchor="middle" font-size="10" fill="#0d47a1">3問快篩</text>
      <text x="${(gx0+midX)/2}" y="${(midY+gy1)/2-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#e65100">Q1 觀望型</text>
      <text x="${(gx0+midX)/2}" y="${(midY+gy1)/2+10}" text-anchor="middle" font-size="10" fill="#e65100">降頻維護</text>
      <text x="${(midX+gx1)/2}" y="${(midY+gy1)/2-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#880e4f">Q3 直接放</text>
      <text x="${(midX+gx1)/2}" y="${(midY+gy1)/2+10}" text-anchor="middle" font-size="10" fill="#880e4f">最後通牒</text>
      <!-- 分隔線與外框 -->
      <line x1="${midX}" y1="${gy0}" x2="${midX}" y2="${gy1}" stroke="#fff" stroke-width="2"/>
      <line x1="${gx0}" y1="${midY}" x2="${gx1}" y2="${midY}" stroke="#fff" stroke-width="2"/>
      <rect x="${gx0}" y="${gy0}" width="${gx1-gx0}" height="${gy1-gy0}" fill="none" stroke="var(--border2)"/>
      <!-- Y 軸：成交可能性 -->
      <text x="14" y="${gy0+6}" font-size="10" fill="var(--text3)">高</text>
      <text x="14" y="${gy1}" font-size="10" fill="var(--text3)">低</text>
      <text x="14" y="${(gy0+gy1)/2}" font-size="10" fill="var(--text2)" transform="rotate(-90 14 ${(gy0+gy1)/2})" text-anchor="middle">成交可能性</text>
      <!-- X 軸：投入成本 -->
      <text x="${gx0}" y="${gy1+16}" font-size="10" fill="var(--text3)">低</text>
      <text x="${gx1}" y="${gy1+16}" font-size="10" fill="var(--text3)" text-anchor="end">高</text>
      <text x="${(gx0+gx1)/2}" y="${gy1+28}" font-size="10" fill="var(--text2)" text-anchor="middle">投入成本</text>
      ${hasScore?`<circle cx="${px}" cy="${py}" r="7" fill="var(--primary)" stroke="#fff" stroke-width="2"/>`:''}
    </svg>
    ${!hasScore?'<div style="text-align:center;font-size:11px;color:var(--text3);margin-top:6px;">輸入上面兩個分數後，會標出這個案子目前的位置</div>':''}
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border2);display:flex;flex-direction:column;gap:8px;">
      ${['Q2','Q4','Q1','Q3'].map(qk=>`
        <div style="display:flex;gap:8px;align-items:flex-start;">
          <span class="badge badge-${qk}" style="flex-shrink:0;white-space:nowrap;">${Q_DESC[qk]}</span>
          <span style="font-size:12px;color:var(--text2);line-height:1.6;">${Q_DESC_FULL[qk]}</span>
        </div>`).join('')}
    </div>
  </div>`;
}
function priorityHTML(c){
  const q = calcQ(c.prob,c.cost);
  return `
  <div class="sec">
    <div class="sec-title">象限評分</div>
    <div class="field-group">
      <div class="field-row">
        <span class="field-label">評分標準</span>
        <div style="padding:8px 14px;font-size:12px;color:var(--text3);line-height:1.7;">1=低 → 5=高<br>可能性：1 態度曖昧 / 3 需求明確 / 5 強烈需求<br>成本：1 1-2次溝通 / 3 多次會議 / 5 極高投入</div>
      </div>
      <div class="score-row">
        <div class="score-item"><span class="score-label">成交可能性</span><input class="score-input" id="prob-${c.id}" type="number" min="1" max="5" step="0.5" value="${c.prob||''}" placeholder="1-5" onchange="saveScore(${c.id})"></div>
        <div class="score-item"><span class="score-label">投入成本</span><input class="score-input" id="cost-${c.id}" type="number" min="1" max="5" step="0.5" value="${c.cost||''}" placeholder="1-5" onchange="saveScore(${c.id})"></div>
        <div id="qdisplay-${c.id}">${q?`<span class="badge badge-${q}" title="${Q_DESC_FULL[q]}" style="cursor:help;">${Q_DESC[q]}</span>`:'<span style="color:var(--text3);font-size:12px;">輸入分數後自動判斷</span>'}</div>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">四象限圖</div>
    ${quadrantChartHTML(c.prob, c.cost)}
  </div>

  ${q==='Q4'?`
  <div class="sec">
    <div class="sec-title">3 問快篩</div>
    <div class="field-group">
      <div class="check-group">
        ${['合約金額 > 公司平均單 × 3 倍（或超過半年業績目標）→ 全力投入','業界標竿 / 未來有持續合作 / 老闆要求拿下 → 戰略投入','FAE/PM 願意投入 + 有現成方案 + 決策流程清楚 → 可以做（設時限）'].map((q4q,i)=>`
          <label class="check-item">
            <input type="checkbox" ${(c.q4Screen||[])[i]?'checked':''} onchange="setQ4Screen(${c.id},${i},this.checked)">
            <span style="font-size:12px;">${q4q}</span>
          </label>`).join('')}
      </div>
    </div>
  </div>`:''}`;
}

// ── 日誌 Tab ──
function logHTML(c){
  return `
  <div class="sec">
    <div class="sec-title">追蹤日誌</div>
    ${(c.logs||[]).map(l=>{
      const isToday = hasTodayLog({logs:[l]});
      return `<div class="log-entry${isToday?' today':''}">
        <div class="log-view">
          <div class="log-date">${isToday?`<span class="log-dot"></span>`:''} ${l.date}</div>
          <div class="log-text">${l.text.replace(/\n/g,'<br>')}</div>
          <div class="log-actions">
            <button class="log-btn" onclick="toggleLogEdit(${c.id},${l.id})" title="編輯"><i class="ti ti-pencil"></i></button>
            <button class="log-btn del" onclick="deleteLog(${c.id},${l.id})" title="刪除"><i class="ti ti-trash"></i></button>
          </div>
        </div>
        <div class="log-edit" id="log-edit-${c.id}-${l.id}">
          <textarea class="log-edit-ta" id="log-ta-${c.id}-${l.id}">${l.text}</textarea>

    <div class="log-add-row">

// ══════════════════════════════════════
// 資料操作
// ══════════════════════════════════════
function setField(id, field, val){
  const c = getC(id);
  if(field==='status'){
    if(val==='暫緩跟進' && c.status!=='暫緩跟進'){
      c.pausedAt = STAGE_FLOW.includes(c.status) ? c.status : '建立信任';
    }
  }
  c[field] = val;
  c.updatedAt = TODAY;
  save();
  if(field==='status' || field==='diagDM' || field==='diagOver2W' || field==='pushDM' || field==='pushPressure' || field==='pushOpponent' || field==='diagState'){
    renderCustomer(id, currentActiveTab||'diag');
  }
}
function setPoCField(id, key, val){
  const c = getC(id);
  if(!c.diagPoC) c.diagPoC = {};
  c.diagPoC[key] = val;
  c.updatedAt = TODAY;
  save();
}
function toggleStuck(id, opt, checked){
  const c = getC(id);
  if(!c.diagStuck) c.diagStuck = [];
  if(checked){ if(!c.diagStuck.includes(opt)) c.diagStuck.push(opt); }
  else { c.diagStuck = c.diagStuck.filter(x=>x!==opt); }
  c.updatedAt = TODAY;
  save();
}
function setWIIFT(id, idx, checked){
  const c = getC(id);
  if(!c.coldWIIFT) c.coldWIIFT = [false,false,false];
  c.coldWIIFT[idx] = checked;
  save();
}
function setPushPlan(id, key, val){
  const c = getC(id);
  if(!c.pushPlan) c.pushPlan = {};
  c.pushPlan[key] = val;
  c.updatedAt = TODAY;
  save();
}
function setNextMeeting(id, key, val){
  const c = getC(id);
  if(!c.nextMeeting) c.nextMeeting = {};
  c.nextMeeting[key] = val;
  c.updatedAt = TODAY;
  save();
}
function setQuoteField(id, key, val){
  const c = getC(id);
  if(!c.quote) c.quote = {};
  c.quote[key] = val;
  c.updatedAt = TODAY;
  save();
}
function saveScore(id){
  const c = getC(id);
  c.prob = document.getElementById('prob-'+id)?.value || '';
  c.cost = document.getElementById('cost-'+id)?.value || '';
  c.updatedAt = TODAY;
  save();
  renderCustomer(id, 'priority');
}
function saveAmount(id){
  const c = getC(id);
  c.amount = parseFloat(document.getElementById('amt-'+id)?.value) || 0;
  c.updatedAt = TODAY;
  save();
}
function setInvMode(id, mode){
  const c = getC(id);
  if(!c.invoice) c.invoice = defaultInvoice();
  c.invoice.mode = mode;
  if(mode==='60% 頭款 & 40% 尾款'){
    const t = c.amount||0;
    c.invoice.payments = [
      {label:'頭款',invoiced:c.invoice.payments[0]?.invoiced||false,collected:c.invoice.payments[0]?.collected||false,amount:Math.round(t*.6)||'',incomeDate:c.invoice.payments[0]?.incomeDate||''},
      {label:'尾款',invoiced:c.invoice.payments[1]?.invoiced||false,collected:c.invoice.payments[1]?.collected||false,amount:Math.round(t*.4)||'',incomeDate:c.invoice.payments[1]?.incomeDate||''}
    ];
  }
  save();
  renderCustomer(id,'priority');
}
function setInvoiced(id, pi, val){
  const c = getC(id);
  c.invoice.payments[pi].invoiced = val;
  c.updatedAt = TODAY;
  save();
  const o = document.getElementById(`inv-o-${id}-${pi}`);
  const n = document.getElementById(`inv-n-${id}-${pi}`);
  if(o) o.className = 'pay-toggle-btn'+(val?' invoiced':'');
  if(n) n.className = 'pay-toggle-btn'+(!val?' not-inv':'');
}
function savePayField(id, pi, field, val){
  const c = getC(id);
  c.invoice.payments[pi][field] = val;
  c.updatedAt = TODAY;
  save();
}
function setCollected(id, pi){
  const c = getC(id);
  const cb = document.getElementById(`cb-${id}-${pi}`);
  if(!cb) return;
  c.invoice.payments[pi].collected = cb.checked;
  c.updatedAt = TODAY;
  save();
  const lbl = document.getElementById(`cblbl-${id}-${pi}`);
  if(lbl){ lbl.className = 'collected-lbl'+(cb.checked?' yes':''); lbl.textContent = cb.checked?'✓ 已收款':'尚未收款'; }
}
function addPayment(id){
  const c = getC(id);
  c.invoice.payments.push({label:'款項',invoiced:false,collected:false,amount:'',incomeDate:''});
  save();
  renderCustomer(id,'priority');
}
function removePayment(id, pi){
  const c = getC(id);
  c.invoice.payments.splice(pi,1);
  save();
  renderCustomer(id,'priority');
}
function setQ4Screen(id, idx, checked){
  const c = getC(id);
  if(!c.q4Screen) c.q4Screen = [false,false,false];
  c.q4Screen[idx] = checked;
  save();
}

// 日誌
function addLog(id){
  const el = document.getElementById('log-input-'+id);
  if(!el || !el.value.trim()) return;
  const c = getC(id);
  if(!c.logs) c.logs = [];
  c.logs.unshift({id:nextLogId++, date:TODAY, text:el.value.trim()});
  c.updatedAt = TODAY;
  el.value = '';
  save();
  renderCustomer(id,'log');
}
function deleteLog(cid, lid){
  const c = getC(cid);
  c.logs = c.logs.filter(l=>l.id!==lid);
  save();
  renderCustomer(cid,'log');
}
function toggleLogEdit(cid, lid){
  document.getElementById(`log-edit-${cid}-${lid}`)?.classList.toggle('open');
}
function saveLog(cid, lid){
  const c = getC(cid);
  const l = c.logs.find(x=>x.id===lid);
  const ta = document.getElementById(`log-ta-${cid}-${lid}`);
  const dt = document.getElementById(`log-dt-${cid}-${lid}`);
  if(ta&&l){ l.text=ta.value.trim()||l.text; if(dt) l.date=dt.value||l.date; }
  save();
  renderCustomer(cid,'log');
}

// ══════════════════════════════════════
// 新增 / 編輯客戶
// ══════════════════════════════════════
function openModal(id=null){
  editingId = id;
  document.getElementById('modal-title').textContent = id ? '編輯客戶' : '新增客戶';
  if(id){
    const c = getC(id);
    document.getElementById('f-name').value = c.name||'';
    document.getElementById('f-company').value = c.company||'';
    document.getElementById('f-si').value = c.siPartner||'';
    document.getElementById('f-title').value = c.title||'';
    document.getElementById('f-contact').value = c.contact||'';
    document.getElementById('f-status').value = c.status;
    document.getElementById('f-abc').value = c.abc||'';
    document.getElementById('f-amount').value = c.amount||'';
    document.getElementById('f-note').value = c.note||'';
  } else {
    ['f-name','f-company','f-si','f-title','f-contact','f-amount','f-note'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-status').value = '接觸中';
    document.getElementById('f-abc').value = '';
  }
  document.getElementById('modal-bg').style.display = 'flex';
  setTimeout(()=>document.getElementById('f-company').focus(), 50);
}
function closeModal(){ document.getElementById('modal-bg').style.display='none'; editingId=null; }
function saveCustomer(){
  const company = document.getElementById('f-company').value.trim();
  if(!company){ document.getElementById('f-company').focus(); return; }
  const name = document.getElementById('f-name').value.trim();
  const data = {
    name, company,
    siPartner:document.getElementById('f-si').value.trim(),
    title:document.getElementById('f-title').value.trim(),
    contact:document.getElementById('f-contact').value.trim(),
    status:document.getElementById('f-status').value,
    abc:document.getElementById('f-abc').value,
    amount:parseFloat(document.getElementById('f-amount').value)||0,
    note:document.getElementById('f-note').value.trim(),
    updatedAt:TODAY
  };
  if(editingId){
    const c = getC(editingId);
    Object.assign(c, data);
    if(!c.invoice) c.invoice = defaultInvoice();
    if(!c.logs) c.logs = [];
  } else {
    customers.unshift({id:nextId++,...data,invoice:defaultInvoice(),logs:[],prob:'',cost:'',signedDate:''});
  }
  save(); closeModal();
  if(editingId){ renderCustomer(editingId, currentActiveTab||'diag'); }
  else { showOverview(); }
  showToast(editingId?'已更新客戶資料':'✓ 新增客戶成功');
}
function deleteCustomer(id){
  if(!confirm('確定刪除？')) return;
  customers = customers.filter(c=>c.id!==id);
  save(); showOverview();
  showToast('已刪除');
}

// ══════════════════════════════════════
// 匯出 / 備份
// ══════════════════════════════════════
function exportExcel(){
  const wb = XLSX.utils.book_new();
  const rows1 = [['客戶公司','配合的 SI','窗口姓名','職稱','聯絡方式','漏斗階段','客戶分類','成交可能性','投入成本','象限','合約金額','已收款','待收款','備註','最後更新']];
  customers.forEach(c=>{ const q=calcQ(c.prob,c.cost),col=calcCollected(c); rows1.push([c.company||'',c.siPartner||'',c.name||'',c.title||'',c.contact||'',c.status,c.abc?c.abc+'類':'',c.prob||'',c.cost||'',q?`${q} ${Q_DESC[q]||''}`.trim():'',c.amount||0,col,(c.amount||0)-col,c.note||'',c.updatedAt||TODAY]); });
  const ws1 = XLSX.utils.aoa_to_sheet(rows1);
  ws1['!cols'] = [18,16,18,12,18,12,12,12,12,22,14,12,12,20,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws1,'客戶總覽');
  const rows2 = [['客戶公司','窗口姓名','日誌日期','追蹤記錄']];
  customers.forEach(c=>(c.logs||[]).forEach(l=>rows2.push([c.company||'',c.name||'',l.date,l.text])));
  const ws2 = XLSX.utils.aoa_to_sheet(rows2); ws2['!cols']=[{wch:18},{wch:20},{wch:12},{wch:60}];
  XLSX.utils.book_append_sheet(wb,ws2,'追蹤日誌');
  const rows3 = [['客戶公司','窗口姓名','款項','已開票','已收款','預計收款日','金額']];
  customers.forEach(c=>{ if(!c.invoice?.payments) return; c.invoice.payments.forEach(p=>rows3.push([c.company||'',c.name||'',p.label,p.invoiced?'是':'否',p.collected?'是':'否',p.incomeDate||'',p.amount||0])); });
  const ws3 = XLSX.utils.aoa_to_sheet(rows3); ws3['!cols']=[{wch:18},{wch:20},{wch:10},{wch:10},{wch:10},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws3,'收款明細');
  XLSX.writeFile(wb,`BD成交系統_${TODAY}.xlsx`);
  showToast('✓ Excel 已匯出（3 張工作表）');
}
function exportJSON(){
  const blob = new Blob([JSON.stringify({version:'bds_v1',exportedAt:TODAY,customers},null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`BD成交系統備份_${TODAY}.json`; a.click();
  showToast('✓ 備份完成');
}
function importJSON(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      const arr = data.customers||data;
      if(!Array.isArray(arr)) throw new Error();
      if(!confirm(`確定匯入 ${arr.length} 筆客戶資料？現有資料將被覆蓋。`)) return;
      customers = arr;
      nextId = Math.max(0,...customers.map(c=>c.id))+1;
      save(); showOverview();
      showToast(`✓ 已匯入 ${arr.length} 筆客戶`);
    } catch { showToast('檔案格式錯誤'); }
  };
  reader.readAsText(file);
  e.target.value='';
}

// 初始化
if(sessionStorage.getItem('bds_auth')==='1'){ updateDemoModeUI(); showOverview(); }
</script>
