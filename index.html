<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BD 成交系統</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #667eea;
  --primary-d: #5568d3;
  --purple: #764ba2;
  --green: #28a745;
  --green-d: #1e7e34;
  --yellow: #ffc107;
  --red: #dc3545;
  --blue: #1e88e5;
  --orange: #fb8c00;
  --bg: #f5f5f5;
  --bg2: #f8f9fa;
  --card: #ffffff;
  --text: #2d2d2d;
  --text2: #555555;
  --text3: #888888;
  --border: #e0e0e0;
  --border2: #eeeeee;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; -webkit-font-smoothing: antialiased; }

/* ── 畫面切換 ── */
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ════════════════════════════════
   登入頁
════════════════════════════════ */
#screen-login { justify-content: center; align-items: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.login-box { background: #fff; border-radius: 16px; padding: 2.5rem 2rem; width: 340px; max-width: 92vw; text-align: center; }
.login-logo { font-size: 36px; font-weight: 700; letter-spacing: -.02em; color: var(--primary); margin-bottom: 6px; }
.login-logo span { color: var(--purple); }
.login-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.login-sub { font-size: 13px; color: var(--text3); margin-bottom: 28px; }
.login-label { font-size: 12px; color: var(--text2); font-weight: 500; text-align: left; margin-bottom: 6px; display: block; }
.login-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 16px; text-align: center; letter-spacing: .2em; color: var(--text); font-family: var(--font); transition: border-color .15s; }
.login-input:focus { outline: none; border-color: var(--primary); }
.login-input.error { border-color: var(--red); animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.login-btn { width: 100%; margin-top: 12px; padding: 11px; border: none; border-radius: var(--radius); background: linear-gradient(135deg, var(--primary), var(--purple)); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: opacity .15s; }
.login-btn:hover { opacity: .9; }
.login-hint { font-size: 12px; color: var(--text3); margin-top: 14px; line-height: 1.6; }
.login-err { font-size: 12px; color: var(--red); margin-top: 8px; min-height: 18px; }

/* ════════════════════════════════
   主 Layout
════════════════════════════════ */
#screen-main { flex-direction: column; }
.topbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 0 1.25rem; height: 52px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; position: sticky; top: 0; z-index: 50; }
.topbar-logo { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
.topbar-logo span { opacity: .7; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.topbar-badge { font-size: 11px; color: rgba(255,255,255,.8); background: rgba(255,255,255,.18); border-radius: 99px; padding: 3px 10px; }
.topbar-icon-btn { background: none; border: none; color: rgba(255,255,255,.8); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; border-radius: 6px; display: flex; align-items: center; }
.topbar-icon-btn:hover { color: #fff; background: rgba(255,255,255,.12); }

.main-body { flex: 1; }
.page { display: none; }
.page.active { display: block; }

/* ════════════════════════════════
   Pipeline 頁
════════════════════════════════ */
#page-pipeline { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
.pipeline-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px; }
.pipeline-title { font-size: 19px; font-weight: 600; color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text2); font-family: var(--font); transition: all .12s; white-space: nowrap; }
.btn:hover { background: var(--bg2); }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--purple)); color: #fff; border: none; }
.btn-primary:hover { opacity: .9; }
.btn-sm { padding: 5px 11px; font-size: 12px; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.25rem; }
.stat-card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px; text-align: center; }
.stat-num { font-size: 22px; font-weight: 600; }
.stat-num.primary { color: var(--primary); }
.stat-num.green { color: var(--green); }
.stat-num.red { color: var(--red); }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* 搜尋篩選 */
.search-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.search-input { flex: 1; min-width: 160px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; background: var(--card); color: var(--text); font-family: var(--font); }
.search-input:focus { outline: none; border-color: var(--primary); }
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 11px; border-radius: 99px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); transition: all .12s; user-select: none; }
.chip.on-all { background: var(--primary); color: #fff; border-color: var(--primary); }
.chip.on-接觸中 { background: #fce4ec; color: #880e4f; border-color: #f48fb1; }
.chip.on-建立信任 { background: #fff8e1; color: #e65100; border-color: #ffe082; }
.chip.on-推進中 { background: #ede7f6; color: #4527a0; border-color: #b39ddb; }
.chip.on-成交談判 { background: #e3f2fd; color: #0d47a1; border-color: #90caf9; }
.chip.on-已簽約 { background: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; }
.chip.on-暫緩跟進 { background: #f5f5f5; color: #555; border-color: #bbb; }

/* 客戶列表 */
.cust-list { display: flex; flex-direction: column; gap: 8px; }
.cust-card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: box-shadow .15s; }
.cust-card:hover { box-shadow: 0 2px 12px rgba(102,126,234,.15); }
.cust-card.overdue { border-left: 3px solid var(--red); }
.cust-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; position: relative; }
.av-dot { position: absolute; top: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); border: 2px solid var(--card); }
.cust-info { flex: 1; min-width: 0; }
.cust-name { font-size: 14px; font-weight: 600; }
.cust-co { font-size: 12px; color: var(--text3); margin-top: 1px; }
.cust-preview { font-size: 12px; color: var(--text3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
.cust-preview.urgent { color: var(--red); }
.cust-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.badge { font-size: 11px; padding: 2px 9px; border-radius: 99px; white-space: nowrap; font-weight: 500; }
.badge-接觸中 { background: #fce4ec; color: #880e4f; }
.badge-建立信任 { background: #fff8e1; color: #e65100; }
.badge-推進中 { background: #ede7f6; color: #4527a0; }
.badge-成交談判 { background: #e3f2fd; color: #0d47a1; }
.badge-已簽約 { background: #e8f5e9; color: #1b5e20; }
.badge-暫緩跟進 { background: #f5f5f5; color: #555; }
.badge-A { background: #ede7f6; color: #4527a0; }
.badge-B { background: #e3f2fd; color: #0d47a1; }
.badge-C { background: #f5f5f5; color: #555; }
.badge-Q1 { background: #fff8e1; color: #e65100; }
.badge-Q2 { background: #e8f5e9; color: #1b5e20; }
.badge-Q3 { background: #fce4ec; color: #880e4f; }
.badge-Q4 { background: #e3f2fd; color: #0d47a1; }
.cust-last { font-size: 11px; color: var(--text3); }

.empty-state { text-align: center; padding: 3rem; color: var(--text3); }
.empty-state i { font-size: 42px; display: block; margin-bottom: 12px; opacity: .3; }
.empty-state p { font-size: 14px; }

/* 推進提醒 Banner */
.overdue-banner { background: #fff5f5; border: 1px solid #ffc9c9; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 1rem; font-size: 13px; color: #c0392b; display: flex; align-items: center; gap: 8px; }

/* ════════════════════════════════
   客戶詳情頁
════════════════════════════════ */
#page-customer { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
.cust-page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.back-btn { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--primary); cursor: pointer; background: none; border: none; font-family: var(--font); padding: 0; }
.back-btn:hover { opacity: .75; }
.cust-page-title { font-size: 18px; font-weight: 600; }
.cust-page-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.cust-page-actions { margin-left: auto; display: flex; gap: 6px; }

/* Tabs */
.tab-nav { display: flex; border-bottom: 1px solid var(--border2); margin-bottom: 1.25rem; gap: 0; overflow-x: auto; scrollbar-width: none; }
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn { padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--text3); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-family: var(--font); transition: all .12s; }
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* 共用 section */
.sec { margin-bottom: 1.25rem; }
.sec-title { font-size: 11px; font-weight: 600; color: var(--primary); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
.field-group { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; }
.field-row { display: flex; border-bottom: 1px solid var(--border2); }
.field-row:last-child { border-bottom: none; }
.field-label { font-size: 12px; color: var(--text2); padding: 10px 14px; min-width: 120px; background: var(--bg2); font-weight: 500; display: flex; align-items: center; }
.field-val { font-size: 13px; color: var(--text); padding: 10px 14px; flex: 1; }
.field-input { font-size: 13px; color: var(--text); padding: 9px 14px; flex: 1; border: none; background: transparent; font-family: var(--font); }
.field-input:focus { outline: none; background: #fafbff; }
.field-select { font-size: 13px; color: var(--text); padding: 9px 14px; flex: 1; border: none; background: transparent; font-family: var(--font); }
.field-select:focus { outline: none; }
.field-textarea { font-size: 13px; color: var(--text); padding: 9px 14px; flex: 1; border: none; background: transparent; font-family: var(--font); resize: vertical; min-height: 70px; }
.field-textarea:focus { outline: none; }

/* 狀態按鈕 */
.status-btns { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px; }
.s-btn { padding: 4px 12px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--bg2); color: var(--text2); font-family: var(--font); transition: all .12s; }
.s-btn.sel-接觸中 { background: #fce4ec; color: #880e4f; border-color: #f48fb1; font-weight: 600; }
.s-btn.sel-建立信任 { background: #fff8e1; color: #e65100; border-color: #ffe082; font-weight: 600; }
.s-btn.sel-推進中 { background: #ede7f6; color: #4527a0; border-color: #b39ddb; font-weight: 600; }
.s-btn.sel-成交談判 { background: #e3f2fd; color: #0d47a1; border-color: #90caf9; font-weight: 600; }
.s-btn.sel-已簽約 { background: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; font-weight: 600; }
.s-btn.sel-暫緩跟進 { background: #f5f5f5; color: #555; border-color: #bbb; font-weight: 600; }

/* ABC */
.abc-btns { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px; }
.abc-btn { padding: 4px 14px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--bg2); color: var(--text2); font-family: var(--font); transition: all .12s; }
.abc-btn.sel-A { background: #ede7f6; color: #4527a0; border-color: #b39ddb; font-weight: 600; }
.abc-btn.sel-B { background: #e3f2fd; color: #0d47a1; border-color: #90caf9; font-weight: 600; }
.abc-btn.sel-C { background: #f5f5f5; color: #555; border-color: #bbb; font-weight: 600; }

/* 卡點 checkbox */
.check-group { padding: 10px 14px; display: flex; flex-direction: column; gap: 7px; }
.check-item { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check-item input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }

/* 系統建議 */
.rec-box { background: linear-gradient(135deg, #eef2ff, #f5f0ff); border: 1px solid #c5cff8; border-radius: var(--radius); padding: 14px 16px; margin-top: 1rem; }
.rec-label { font-size: 11px; font-weight: 600; color: var(--primary); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
.rec-text { font-size: 14px; color: var(--text); line-height: 1.6; }
.rec-action { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.rec-btn { padding: 7px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--primary); color: var(--primary); background: transparent; font-family: var(--font); }
.rec-btn:hover { background: var(--primary); color: #fff; }
.rec-btn.primary { background: var(--primary); color: #fff; }

/* 象限評分 */
.score-row { display: flex; gap: 16px; padding: 10px 14px; align-items: center; flex-wrap: wrap; }
.score-item { display: flex; align-items: center; gap: 8px; }
.score-label { font-size: 12px; color: var(--text2); }
.score-input { width: 58px; padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--card); color: var(--text); text-align: center; font-family: var(--font); }
.score-input:focus { outline: none; border-color: var(--primary); }

/* 收款 */
.payment-summary { display: flex; gap: 16px; padding: 10px 14px; background: #e8f4f8; border-radius: var(--radius); margin-bottom: 10px; flex-wrap: wrap; }
.psummary-item { font-size: 13px; color: var(--text2); }
.psummary-item strong { font-weight: 600; }
.psummary-item.green strong { color: var(--green); }
.psummary-item.orange strong { color: var(--orange); }
.inv-mode-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.inv-btn { padding: 5px 13px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--card); color: var(--text2); font-family: var(--font); }
.inv-btn.sel { background: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; font-weight: 600; }
.pay-row { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
.pay-row-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pay-toggle { display: flex; border: 1px solid var(--border); border-radius: 99px; overflow: hidden; font-size: 12px; }
.pay-toggle-btn { padding: 3px 11px; cursor: pointer; background: var(--bg2); color: var(--text2); border: none; font-family: var(--font); }
.pay-toggle-btn.invoiced { background: #e8f5e9; color: #1b5e20; font-weight: 600; }
.pay-toggle-btn.not-inv { background: #fff8e1; color: #e65100; font-weight: 600; }
.pay-meta { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.pay-meta-label { font-size: 12px; color: var(--text3); }
.pay-date-input, .pay-amt-input { padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; background: var(--card); color: var(--text); font-family: var(--font); }
.pay-amt-input { width: 120px; }
.pay-date-input:focus, .pay-amt-input:focus { outline: none; border-color: var(--primary); }
.collected-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.collected-cb { width: 15px; height: 15px; accent-color: var(--green); cursor: pointer; }
.collected-lbl { font-size: 12px; color: var(--text2); cursor: pointer; }
.collected-lbl.yes { color: var(--green); font-weight: 600; }
.btn-add-pay { margin-top: 8px; padding: 5px 12px; border: 1px dashed var(--border); border-radius: var(--radius); font-size: 12px; cursor: pointer; background: transparent; color: var(--text3); font-family: var(--font); }
.btn-add-pay:hover { color: var(--primary); border-color: var(--primary); }

/* 日誌 */
.log-entry { border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; background: var(--bg2); }
.log-entry.today { border-left: 3px solid var(--red); }
.log-view { display: flex; gap: 10px; }
.log-date { font-size: 11px; color: var(--text3); min-width: 82px; padding-top: 2px; display: flex; align-items: center; gap: 4px; }
.log-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.log-text { flex: 1; font-size: 13px; color: var(--text); line-height: 1.6; word-break: break-word; }
.log-actions { display: flex; gap: 2px; }
.log-btn { background: none; border: none; cursor: pointer; padding: 3px 5px; border-radius: 4px; font-size: 15px; color: var(--text3); }
.log-btn:hover { color: var(--text); }
.log-btn.del:hover { color: var(--red); }
.log-edit { display: none; margin-top: 8px; }
.log-edit.open { display: block; }
.log-edit-ta { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--card); color: var(--text); resize: vertical; min-height: 60px; font-family: var(--font); }
.log-edit-ta:focus { outline: none; border-color: var(--primary); }
.log-edit-row { display: flex; gap: 6px; margin-top: 7px; align-items: center; flex-wrap: wrap; }
.log-date-input { padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; background: var(--card); color: var(--text); font-family: var(--font); }
.btn-save-log { padding: 5px 14px; border: none; border-radius: var(--radius); background: var(--primary); color: #fff; font-size: 12px; cursor: pointer; font-weight: 500; font-family: var(--font); }
.btn-cancel-log { padding: 5px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text2); font-size: 12px; cursor: pointer; font-family: var(--font); }
.log-add-row { display: flex; gap: 8px; margin-top: 8px; }
.log-input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--card); color: var(--text); font-family: var(--font); }
.log-input:focus { outline: none; border-color: var(--primary); }
.btn-log { padding: 8px 14px; border: none; border-radius: var(--radius); background: var(--primary); color: #fff; font-size: 13px; cursor: pointer; font-weight: 500; font-family: var(--font); }
.log-hint { font-size: 11px; color: var(--text3); margin-top: 6px; }

.card-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border2); }

/* ════════════════════════════════
   Modal
════════════════════════════════ */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 1.5rem; width: 400px; max-width: 94vw; max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; color: var(--text); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; background: var(--bg2); color: var(--text); font-family: var(--font); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); }
.modal-btns { display: flex; gap: 8px; margin-top: 1.25rem; }
.btn-confirm { flex: 1; padding: 9px; border: none; border-radius: var(--radius); background: linear-gradient(135deg, var(--primary), var(--purple)); color: #fff; font-size: 14px; cursor: pointer; font-weight: 600; font-family: var(--font); }
.btn-cancel-modal { flex: 1; padding: 9px; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text); font-size: 14px; cursor: pointer; font-family: var(--font); }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--primary), var(--purple)); color: #fff; font-size: 13px; padding: 10px 22px; border-radius: 99px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; font-weight: 500; white-space: nowrap; }
.toast.show { opacity: 1; }

/* ── Responsive ── */
@media(max-width:640px){
  input,select,textarea{font-size:16px!important;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .cust-right{flex-direction:row;align-items:center;gap:5px;flex-wrap:wrap;}
  .tab-btn{padding:8px 12px;font-size:12px;}
  #page-pipeline,#page-customer{padding:1rem .75rem 4rem;}
}
@media(pointer:coarse){
  .s-btn,.abc-btn,.chip,.inv-btn,.pay-toggle-btn{min-height:32px;display:inline-flex;align-items:center;}
  .log-btn{padding:6px 8px;font-size:18px;}
  .collected-cb{width:18px;height:18px;}
}
</style>
</head>
<body>

<!-- ── 登入 ── -->
<div id="screen-login" class="screen active">
  <div class="login-box">
    <div class="login-logo">BD<span>.</span></div>
    <div class="login-title">BD 成交系統</div>
    <div class="login-sub">工作坊學員專屬 · 你的 BD 系統</div>
    <label class="login-label">通關密語</label>
    <input class="login-input" id="pwd-input" type="password" placeholder="輸入密語" maxlength="20" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">進入系統</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-hint">資料存在你的瀏覽器，<br>備份後可在任何裝置還原</div>
  </div>
</div>

<!-- ── 主畫面 ── -->
<div id="screen-main" class="screen">
  <div class="topbar">
    <div class="topbar-logo">BD<span>.</span></div>
    <div class="topbar-badge"><i class="ti ti-users" style="font-size:10px;margin-right:3px;"></i>學員版</div>
    <div class="topbar-right">
      <button class="topbar-icon-btn" onclick="exportExcel()" title="匯出 Excel"><i class="ti ti-table-export"></i></button>
      <button class="topbar-icon-btn" onclick="exportJSON()" title="備份資料"><i class="ti ti-download"></i></button>
      <button class="topbar-icon-btn" onclick="document.getElementById('import-file').click()" title="還原備份"><i class="ti ti-upload"></i></button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(event)">
      <button class="topbar-icon-btn" onclick="logout()" title="登出"><i class="ti ti-logout"></i></button>
    </div>
  </div>
  <div class="main-body">
    <div id="page-pipeline" class="page active"></div>
    <div id="page-customer" class="page"></div>
  </div>
</div>

<div id="modal-bg" class="modal-bg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modal-title">新增客戶</h3>
    <div class="field"><label>客戶姓名 *</label><input id="f-name" type="text" placeholder="王小明"></div>
    <div class="field"><label>公司名稱</label><input id="f-company" type="text" placeholder="ABC 科技有限公司"></div>
    <div class="field"><label>職稱</label><input id="f-title" type="text" placeholder="採購經理 / CTO"></div>
    <div class="field"><label>聯絡方式</label><input id="f-contact" type="text" placeholder="email / 電話 / LINE"></div>
    <div class="field"><label>漏斗階段</label>
      <select id="f-status">
        <option>接觸中</option><option>建立信任</option><option>推進中</option>
        <option>成交談判</option><option>已簽約</option><option>暫緩跟進</option>
      </select>
    </div>
    <div class="field"><label>客戶分類</label>
      <select id="f-abc"><option value="">未分類</option><option value="A">A 類｜全力投入</option><option value="B">B 類｜輕量維護</option><option value="C">C 類｜準備放棄</option></select>
    </div>
    <div class="field"><label>合約金額（NTD）</label><input id="f-amount" type="number" placeholder="0"></div>
    <div class="field"><label>備註</label><textarea id="f-note" rows="2" placeholder="產業背景、特殊條件…"></textarea></div>
    <div class="modal-btns">
      <button class="btn-confirm" onclick="saveCustomer()">儲存</button>
      <button class="btn-cancel-modal" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ══════════════════════════════════════
// 常數 & 工具
// ══════════════════════════════════════
const PWD = 'BDS';
const TODAY = new Date().toISOString().slice(0,10);
const STATUSES = ['接觸中','建立信任','推進中','成交談判','已簽約','暫緩跟進'];
const INV_MODES = ['60% 頭款 & 40% 尾款','結案後付款','自訂'];
const Q_DESC = {Q1:'觀望型｜降頻維護',Q2:'快速贏｜全力加碼',Q3:'直接放｜最後通牒',Q4:'戰略型｜3問快篩'};
const AV_COLORS = [
  ['#e8eaf6','#3949ab'],['#e8f5e9','#2e7d32'],['#fff3e0','#e65100'],
  ['#fce4ec','#880e4f'],['#e3f2fd','#1565c0'],['#f3e5f5','#6a1b9a'],['#e0f2f1','#00695c']
];

const avatarColor = name => AV_COLORS[name.charCodeAt(0)%AV_COLORS.length];
const calcQ = (p,c) => { const pv=parseFloat(p)||0,cv=parseFloat(c)||0; if(!pv&&!cv)return''; if(pv>=4&&cv<=3)return'Q2'; if(pv>=4&&cv>=4)return'Q4'; if(pv<=3&&cv<=3)return'Q1'; return'Q3'; };
const calcCollected = c => (c.invoice?.payments||[]).reduce((s,p)=>s+(p.collected?parseFloat(p.amount)||0:0),0);
const lastLogDate = c => c.logs?.length ? c.logs.slice().sort((a,b)=>b.date.localeCompare(a.date))[0].date : null;
const daysSince = d => d ? Math.floor((new Date()-new Date(d))/864e5) : 999;
const isOverdue = c => !['已簽約','暫緩跟進'].includes(c.status) && daysSince(lastLogDate(c)) >= 7;
const hasTodayLog = c => (c.logs||[]).some(l => { const m=l.text.match(/(\d{4}[-\/]\d{1,2}[-\/]\d{1,2}|\d{1,2}[-\/]\d{1,2})/g)||[]; return m.some(s=>{ const pts=s.split(/[-\/]/); const d=pts.length===3?`${pts[0].padStart(4,'20')}-${pts[1].padStart(2,'0')}-${pts[2].padStart(2,'0')}`:`${new Date().getFullYear()}-${pts[0].padStart(2,'0')}-${pts[1].padStart(2,'0')}`; return d===TODAY; }); });

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ══════════════════════════════════════
// 登入
// ══════════════════════════════════════
function doLogin(){
  const v = document.getElementById('pwd-input').value.trim().toUpperCase();
  if(v !== PWD){
    const el = document.getElementById('pwd-input');
    el.classList.add('error');
    document.getElementById('login-err').textContent = '密語不正確，請向講師確認';
    setTimeout(()=>{ el.classList.remove('error'); el.value=''; },600);
    return;
  }
  sessionStorage.setItem('bds_auth','1');
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  renderPipeline();
}
function logout(){
  if(!confirm('確定登出？'))return;
  sessionStorage.removeItem('bds_auth');
  document.getElementById('screen-main').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('pwd-input').value='';
  document.getElementById('login-err').textContent='';
}
if(sessionStorage.getItem('bds_auth')==='1'){
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
}

// ══════════════════════════════════════
// 資料
// ══════════════════════════════════════
let customers = JSON.parse(localStorage.getItem('bds_v1')||'[]');
let nextId = customers.length ? Math.max(...customers.map(c=>c.id))+1 : 1;
let nextLogId = 2000;
let currentCustomerId = null;
let activeFilters = new Set();
let editingId = null;

function save(){ localStorage.setItem('bds_v1',JSON.stringify(customers)); }
function getC(id){ return customers.find(c=>c.id===id); }

function defaultInvoice(){ return {mode:'',customMode:'',payments:[{label:'頭款',invoiced:false,collected:false,amount:'',incomeDate:''},{label:'尾款',invoiced:false,collected:false,amount:'',incomeDate:''}]}; }

// ══════════════════════════════════════
// 系統建議邏輯
// ══════════════════════════════════════
function getRecommendation(c){
  const stage = c.status;
  const stuck = (c.diagStuck||[]);
  const dmOk = c.diagDM;
  const over2w = c.diagOver2W;
  const q = calcQ(c.prob,c.cost);

  if(stage==='接觸中'){
    if(!c.diagResearch) return { text:'還沒做客戶研究。先去了解對方的產業、痛點，再寫陌開信。', tab:'陌開', action:'去填陌開框架' };
    return { text:'已有研究基礎，現在寫出 3 句話陌開信，確認 WIIFT 再發出。', tab:'陌開', action:'開始寫陌開信' };
  }
  if(stage==='建立信任'){
    if(stuck.includes('客戶有興趣但沒急迫性')) return { text:'客戶有興趣但沒急迫性。你需要幫他找到「現在就決定」的理由——季末預算、競品動態、或內部痛點加劇。', tab:'推進', action:'設計推進計畫' };
    return { text:'繼續建立信任。每次互動要有「小收穫」——一個確認、一個問題的解答、一個共識。', tab:'日誌', action:'記錄今天互動' };
  }
  if(stage==='推進中'){
    if(!dmOk) return { text:'⚠ 還沒接觸到 Decision Maker。現在最重要的事不是繼續推，是找到真正能拍板的人。', tab:'推進', action:'設計推進計畫' };
    if(over2w) return { text:'卡超過 2 週了。用工具表 C 的三個問題（DM / 決策壓力 / 內部反對者）重新診斷，然後設計接下來 2 週的推進節奏。', tab:'推進', action:'重新設計推進計畫' };
    return { text:'案子在推進中，維持節奏。記得每次互動結束都要確認「下一步是什麼、誰負責、什麼時間」。', tab:'推進', action:'查看推進計畫' };
  }
  if(stage==='成交談判'){
    if(stuck.includes('價格/條款談不攏')) return { text:'價格卡住了。先確認「對方是真的嫌貴，還是還沒被說服」——可以問：如果價格不是問題，你還有什麼顧慮？', tab:'診斷', action:'更新診斷' };
    if(stuck.includes('決策流程拖延')) return { text:'決策流程拖延。準備一份讓 Contact 可以直接轉給老闆的一頁紙，幫他降低內部推銷的難度。', tab:'推進', action:'設計推進計畫' };
    return { text:'進入成交談判，專注在「讓對方做決定」。給具體選項，不給開放式問題。', tab:'日誌', action:'記錄今天進展' };
  }
  if(stage==='已簽約') return { text:'恭喜簽約！記得追蹤收款進度，並且想想這個客戶能不能成為下一個 case study 或引薦來源。', tab:'收款', action:'更新收款狀態' };
  if(stage==='暫緩跟進'){
    if(q==='Q3') return { text:'這個客戶在象限 3（低可能性 + 高成本）。考慮給一次「最後通牒」——直接問能不能定下一步，沒有回應就正式停損。', tab:'優先度', action:'評估是否繼續' };
    return { text:'暫緩跟進中。每月 check-in 一次，保持存在感。等對方有新動態再重新評估要不要加碼。', tab:'日誌', action:'設提醒' };
  }
  return { text:'繼續加油！記得每次互動後更新日誌，讓系統幫你追蹤節奏。', tab:'日誌', action:'記錄互動' };
}

// ══════════════════════════════════════
// Pipeline 頁
// ══════════════════════════════════════
function renderPipeline(){
  showPage('pipeline');
  const q = document.getElementById('pipe-search')?.value?.toLowerCase()||'';
  let list = customers.filter(c=>{
    if(q && !c.name.toLowerCase().includes(q) && !(c.company||'').toLowerCase().includes(q)) return false;
    if(activeFilters.size && !activeFilters.has(c.status)) return false;
    return true;
  });

  const totalAmt = customers.reduce((s,c)=>s+(c.amount||0),0);
  const signed = customers.filter(c=>c.status==='已簽約').length;
  const overdueCount = customers.filter(isOverdue).length;
  const todayFU = customers.filter(hasTodayLog).length;

  const chipHTML = (label, key) => {
    const on = activeFilters.has(key) ? ` on-${key}` : '';
    return `<span class="chip${on}" onclick="toggleFilter('${key}')">${label}</span>`;
  };
  const allOn = activeFilters.size===0 ? ' on-all' : '';

  document.getElementById('page-pipeline').innerHTML = `
    <div class="pipeline-header">
      <div class="pipeline-title">我的 Pipeline</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sm" onclick="exportExcel()"><i class="ti ti-table-export"></i> Excel</button>
        <button class="btn btn-sm btn-primary" onclick="openModal()"><i class="ti ti-plus"></i> 新增客戶</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num primary">${customers.length}</div><div class="stat-label">追蹤中</div></div>
      <div class="stat-card"><div class="stat-num green">${signed}</div><div class="stat-label">已簽約</div></div>
      <div class="stat-card"><div class="stat-num primary" style="font-size:16px;padding-top:3px;">NT$ ${totalAmt>=10000?Math.round(totalAmt/10000)+'萬':totalAmt.toLocaleString()}</div><div class="stat-label">合約總額</div></div>
      <div class="stat-card"><div class="stat-num ${overdueCount?'red':'primary'}">${overdueCount}</div><div class="stat-label">需要跟進</div></div>
    </div>

    ${overdueCount?`<div class="overdue-banner"><i class="ti ti-bell-ringing"></i>有 ${overdueCount} 個客戶超過 7 天沒有追蹤，建議今天發一封推進信。</div>`:''}

    <div class="search-row">
      <input class="search-input" id="pipe-search" type="text" placeholder="搜尋客戶或公司…" value="${q}" oninput="renderPipeline()">
    </div>
    <div class="filter-chips">
      <span class="chip${allOn}" onclick="clearFilters()">全部</span>
      ${STATUSES.map(s=>chipHTML(s,s)).join('')}
    </div>

    <div class="cust-list">
      ${list.length ? list.map(c=>custCardHTML(c)).join('') : `<div class="empty-state"><i class="ti ti-users"></i><p>${customers.length?'沒有符合條件的客戶':'還沒有客戶，點右上角「新增客戶」開始'}</p></div>`}
    </div>
  `;
}

function custCardHTML(c){
  const col = avatarColor(c.name);
  const q = calcQ(c.prob,c.cost);
  const collected = calcCollected(c);
  const last = lastLogDate(c);
  const od = isOverdue(c);
  const todayFU = hasTodayLog(c);
  const preview = c.logs?.length ? `"${c.logs[0].text}"` : '尚無追蹤記錄';
  return `<div class="cust-card${od?' overdue':''}" onclick="openCustomer(${c.id})">
    <div class="cust-head">
      <div class="avatar" style="background:${col[0]};color:${col[1]}">
        ${c.name.charAt(0)}
        ${todayFU?`<span class="av-dot"></span>`:''}
      </div>
      <div class="cust-info">
        <div class="cust-name">${c.name}${c.title?`<span style="font-weight:400;font-size:12px;color:var(--text3);margin-left:6px;">${c.title}</span>`:''}</div>
        <div class="cust-co">${c.company||'—'}</div>
        <div class="cust-preview${od?' urgent':''}">${od?'⚠ ':''}${preview}</div>
      </div>
      <div class="cust-right">
        <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;">
          <span class="badge badge-${c.status}">${c.status}</span>
          ${c.abc?`<span class="badge badge-${c.abc}">${c.abc} 類</span>`:''}
          ${q?`<span class="badge badge-${q}">${q}</span>`:''}
        </div>
        <div style="font-size:12px;color:var(--text3);">${c.amount?`NT$ ${Number(c.amount).toLocaleString()}`:''}${collected?` · 已收 NT$ ${Number(collected).toLocaleString()}`:''}</div>
        <div class="cust-last">${last?`${last} · ${daysSince(last)}天前`:'尚未追蹤'}</div>
      </div>
    </div>
  </div>`;
}

function toggleFilter(s){ activeFilters.has(s)?activeFilters.delete(s):activeFilters.add(s); renderPipeline(); }
function clearFilters(){ activeFilters.clear(); renderPipeline(); }

// ══════════════════════════════════════
// 客戶詳情頁
// ══════════════════════════════════════
function openCustomer(id){
  currentCustomerId = id;
  showPage('customer');
  renderCustomer(id, 'diag');
}

function renderCustomer(id, activeTab){
  const c = getC(id);
  if(!c) return;
  const col = avatarColor(c.name);
  const rec = getRecommendation(c);

  document.getElementById('page-customer').innerHTML = `
    <div class="cust-page-header">
      <button class="back-btn" onclick="renderPipeline()"><i class="ti ti-arrow-left"></i> Pipeline</button>
      <div>
        <div class="cust-page-title">${c.name}${c.company?` · ${c.company}`:''}</div>
        <div class="cust-page-sub">${c.title||''}${c.title&&c.contact?' · ':''}${c.contact||''}</div>
      </div>
      <div class="cust-page-actions">
        <button class="btn btn-sm" onclick="openModal(${id})"><i class="ti ti-pencil"></i> 編輯</button>
        <button class="btn btn-sm" onclick="deleteCustomer(${id})" style="color:var(--red)"><i class="ti ti-trash"></i></button>
      </div>
    </div>

    <div class="tab-nav">
      ${['diag','cold','push','priority','log'].map((t,i)=>{
        const labels = ['診斷','陌開','推進','優先度','日誌'];
        return `<button class="tab-btn${activeTab===t?' active':''}" onclick="renderCustomer(${id},'${t}')">${labels[i]}</button>`;
      }).join('')}
    </div>

    <div id="tab-content-area">
      ${activeTab==='diag' ? diagHTML(c,rec) : ''}
      ${activeTab==='cold' ? coldHTML(c) : ''}
      ${activeTab==='push' ? pushHTML(c) : ''}
      ${activeTab==='priority' ? priorityHTML(c) : ''}
      ${activeTab==='log' ? logHTML(c) : ''}
    </div>
  `;
}

// ── 診斷 Tab ──
function diagHTML(c, rec){
  const stuck = c.diagStuck||[];
  const STUCK_OPTIONS = ['陌開沒回應','客戶有興趣但沒急迫性','提案後沒消息','沒接觸到 Decision Maker','沒有確認「下一步」','價格/條款談不攏','決策流程拖延','競品介入'];
  return `
  <div class="sec">
    <div class="sec-title">漏斗階段</div>
    <div class="field-group">
      <div class="status-btns">
        ${STATUSES.map(s=>`<button class="s-btn${c.status===s?` sel-${s}`:''}" onclick="setField(${c.id},'status','${s}')">${s}</button>`).join('')}
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">客戶分類（A/B/C）</div>
    <div class="field-group">
      <div class="abc-btns">
        ${['A','B','C'].map(a=>`<button class="abc-btn${c.abc===a?` sel-${a}`:''}" onclick="setField(${c.id},'abc','${c.abc===a?'':a}')">${a} 類｜${a==='A'?'全力投入':a==='B'?'輕量維護':'準備放棄'}</button>`).join('')}
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">你認為卡住的原因</div>
    <div class="field-group">
      <div class="check-group">
        ${STUCK_OPTIONS.map(o=>`
          <label class="check-item">
            <input type="checkbox" ${stuck.includes(o)?'checked':''} onchange="toggleStuck(${c.id},'${o}',this.checked)">
            ${o}

function tabKey(label){

}

// ══════════════════════════════════════
// 資料操作
// ══════════════════════════════════════
function setField(id, field, val){
  const c = getC(id);
  c[field] = val;
  c.updatedAt = TODAY;
  save();
  if(field==='status' || field==='diagDM' || field==='diagOver2W'){
    renderCustomer(id, 'diag');
  }
}
function toggleStuck(id, opt, checked){
  const c = getC(id);
  if(!c.diagStuck) c.diagStuck = [];
  if(checked){ if(!c.diagStuck.includes(opt)) c.diagStuck.push(opt); }
  else { c.diagStuck = c.diagStuck.filter(x=>x!==opt); }
  c.updatedAt = TODAY;
  save();
}
function setWIIFT(id, idx, checked){
  const c = getC(id);
  if(!c.coldWIIFT) c.coldWIIFT = [false,false,false];
  c.coldWIIFT[idx] = checked;
  save();
}
function setPushPlan(id, key, val){
  const c = getC(id);
  if(!c.pushPlan) c.pushPlan = {};
  c.pushPlan[key] = val;
  c.updatedAt = TODAY;
  save();
}
function saveScore(id){
  const c = getC(id);
  c.prob = document.getElementById('prob-'+id)?.value || '';
  c.cost = document.getElementById('cost-'+id)?.value || '';
  c.updatedAt = TODAY;
  save();
  const q = calcQ(c.prob, c.cost);
  const el = document.getElementById('qdisplay-'+id);
  if(el) el.innerHTML = q ? `<span class="badge badge-${q}">${Q_DESC[q]}</span>` : '<span style="color:var(--text3);font-size:12px;">輸入分數後自動判斷</span>';
}
function saveAmount(id){
  const c = getC(id);
  c.amount = parseFloat(document.getElementById('amt-'+id)?.value) || 0;
  c.updatedAt = TODAY;
  save();
}
function setInvMode(id, mode){
  const c = getC(id);
  if(!c.invoice) c.invoice = defaultInvoice();
  c.invoice.mode = mode;
  if(mode==='60% 頭款 & 40% 尾款'){
    const t = c.amount||0;
    c.invoice.payments = [
      {label:'頭款',invoiced:c.invoice.payments[0]?.invoiced||false,collected:c.invoice.payments[0]?.collected||false,amount:Math.round(t*.6)||'',incomeDate:c.invoice.payments[0]?.incomeDate||''},
      {label:'尾款',invoiced:c.invoice.payments[1]?.invoiced||false,collected:c.invoice.payments[1]?.collected||false,amount:Math.round(t*.4)||'',incomeDate:c.invoice.payments[1]?.incomeDate||''}
    ];
  }
  save();
  renderCustomer(id,'priority');
}
function setInvoiced(id, pi, val){
  const c = getC(id);
  c.invoice.payments[pi].invoiced = val;
  c.updatedAt = TODAY;
  save();
  const o = document.getElementById(`inv-o-${id}-${pi}`);
  const n = document.getElementById(`inv-n-${id}-${pi}`);
  if(o) o.className = 'pay-toggle-btn'+(val?' invoiced':'');
  if(n) n.className = 'pay-toggle-btn'+(!val?' not-inv':'');
}
function savePayField(id, pi, field, val){
  const c = getC(id);
  c.invoice.payments[pi][field] = val;
  c.updatedAt = TODAY;
  save();
}
function setCollected(id, pi){
  const c = getC(id);
  const cb = document.getElementById(`cb-${id}-${pi}`);
  if(!cb) return;
  c.invoice.payments[pi].collected = cb.checked;
  c.updatedAt = TODAY;
  save();
  const lbl = document.getElementById(`cblbl-${id}-${pi}`);
  if(lbl){ lbl.className = 'collected-lbl'+(cb.checked?' yes':''); lbl.textContent = cb.checked?'✓ 已收款':'尚未收款'; }
}
function addPayment(id){
  const c = getC(id);
  c.invoice.payments.push({label:'款項',invoiced:false,collected:false,amount:'',incomeDate:''});
  save();
  renderCustomer(id,'priority');
}
function removePayment(id, pi){
  const c = getC(id);
  c.invoice.payments.splice(pi,1);
  save();
  renderCustomer(id,'priority');
}
function setQ4Screen(id, idx, checked){
  const c = getC(id);
  if(!c.q4Screen) c.q4Screen = [false,false,false];
  c.q4Screen[idx] = checked;
  save();
}

// 日誌
function addLog(id){
  const el = document.getElementById('log-input-'+id);
  if(!el || !el.value.trim()) return;
  const c = getC(id);
  if(!c.logs) c.logs = [];
  c.logs.unshift({id:nextLogId++, date:TODAY, text:el.value.trim()});
  c.updatedAt = TODAY;
  el.value = '';
  save();
  renderCustomer(id,'log');
}
function deleteLog(cid, lid){
  const c = getC(cid);
  c.logs = c.logs.filter(l=>l.id!==lid);
  save();
  renderCustomer(cid,'log');
}
function toggleLogEdit(cid, lid){
  document.getElementById(`log-edit-${cid}-${lid}`)?.classList.toggle('open');
}
function saveLog(cid, lid){
  const c = getC(cid);
  const l = c.logs.find(x=>x.id===lid);
  const ta = document.getElementById(`log-ta-${cid}-${lid}`);
  const dt = document.getElementById(`log-dt-${cid}-${lid}`);
  if(ta&&l){ l.text=ta.value.trim()||l.text; if(dt) l.date=dt.value||l.date; }
  save();
  renderCustomer(cid,'log');
}

// ══════════════════════════════════════
// 新增 / 編輯客戶
// ══════════════════════════════════════
function openModal(id=null){
  editingId = id;
  document.getElementById('modal-title').textContent = id ? '編輯客戶' : '新增客戶';
  if(id){
    const c = getC(id);
    document.getElementById('f-name').value = c.name;
    document.getElementById('f-company').value = c.company||'';
    document.getElementById('f-title').value = c.title||'';
    document.getElementById('f-contact').value = c.contact||'';
    document.getElementById('f-status').value = c.status;
    document.getElementById('f-abc').value = c.abc||'';
    document.getElementById('f-amount').value = c.amount||'';
    document.getElementById('f-note').value = c.note||'';
  } else {
    ['f-name','f-company','f-title','f-contact','f-amount','f-note'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-status').value = '接觸中';
    document.getElementById('f-abc').value = '';
  }
  document.getElementById('modal-bg').style.display = 'flex';
  setTimeout(()=>document.getElementById('f-name').focus(), 50);
}
function closeModal(){ document.getElementById('modal-bg').style.display='none'; editingId=null; }
function saveCustomer(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ document.getElementById('f-name').focus(); return; }
  const data = {
    name, company:document.getElementById('f-company').value.trim(),
    title:document.getElementById('f-title').value.trim(),
    contact:document.getElementById('f-contact').value.trim(),
    status:document.getElementById('f-status').value,
    abc:document.getElementById('f-abc').value,
    amount:parseFloat(document.getElementById('f-amount').value)||0,
    note:document.getElementById('f-note').value.trim(),
    updatedAt:TODAY
  };
  if(editingId){
    const c = getC(editingId);
    Object.assign(c, data);
    if(!c.invoice) c.invoice = defaultInvoice();
    if(!c.logs) c.logs = [];
  } else {
    customers.unshift({id:nextId++,...data,invoice:defaultInvoice(),logs:[],prob:'',cost:'',signedDate:''});
  }
  save(); closeModal();
  if(editingId){ renderCustomer(editingId,'diag'); }
  else { renderPipeline(); }
  showToast(editingId?'已更新客戶資料':'✓ 新增客戶成功');
}
function deleteCustomer(id){
  if(!confirm('確定刪除？')) return;
  customers = customers.filter(c=>c.id!==id);
  save(); renderPipeline();
  showToast('已刪除');
}

// ══════════════════════════════════════
// 頁面切換
// ══════════════════════════════════════
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name)?.classList.add('active');
}

// ══════════════════════════════════════
// 匯出 / 備份
// ══════════════════════════════════════
function exportExcel(){
  const wb = XLSX.utils.book_new();
  const rows1 = [['客戶姓名','公司','職稱','聯絡方式','漏斗階段','客戶分類','成交可能性','投入成本','象限','合約金額','已收款','待收款','備註','最後更新']];
  customers.forEach(c=>{ const q=calcQ(c.prob,c.cost),col=calcCollected(c); rows1.push([c.name,c.company||'',c.title||'',c.contact||'',c.status,c.abc?c.abc+'類':'',c.prob||'',c.cost||'',q?`${q} ${Q_DESC[q]||''}`.trim():'',c.amount||0,col,(c.amount||0)-col,c.note||'',c.updatedAt||TODAY]); });
  const ws1 = XLSX.utils.aoa_to_sheet(rows1);
  ws1['!cols'] = [18,18,12,18,12,12,12,12,22,14,12,12,20,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws1,'客戶總覽');
  const rows2 = [['客戶','公司','日誌日期','追蹤記錄']];
  customers.forEach(c=>(c.logs||[]).forEach(l=>rows2.push([c.name,c.company||'',l.date,l.text])));
  const ws2 = XLSX.utils.aoa_to_sheet(rows2); ws2['!cols']=[{wch:18},{wch:20},{wch:12},{wch:60}];
  XLSX.utils.book_append_sheet(wb,ws2,'追蹤日誌');
  const rows3 = [['客戶','公司','款項','已開票','已收款','預計收款日','金額']];
  customers.forEach(c=>{ if(!c.invoice?.payments) return; c.invoice.payments.forEach(p=>rows3.push([c.name,c.company||'',p.label,p.invoiced?'是':'否',p.collected?'是':'否',p.incomeDate||'',p.amount||0])); });
  const ws3 = XLSX.utils.aoa_to_sheet(rows3); ws3['!cols']=[{wch:18},{wch:20},{wch:10},{wch:10},{wch:10},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws3,'收款明細');
  XLSX.writeFile(wb,`BD成交系統_${TODAY}.xlsx`);
  showToast('✓ Excel 已匯出（3 張工作表）');
}
function exportJSON(){
  const blob = new Blob([JSON.stringify({version:'bds_v1',exportedAt:TODAY,customers},null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`BD成交系統備份_${TODAY}.json`; a.click();
  showToast('✓ 備份完成');
}
function importJSON(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      const arr = data.customers||data;
      if(!Array.isArray(arr)) throw new Error();
      if(!confirm(`確定匯入 ${arr.length} 筆客戶資料？現有資料將被覆蓋。`)) return;
      customers = arr;
      nextId = Math.max(0,...customers.map(c=>c.id))+1;
      save(); renderPipeline();
      showToast(`✓ 已匯入 ${arr.length} 筆客戶`);
    } catch { showToast('檔案格式錯誤'); }
  };
  reader.readAsText(file);
  e.target.value='';
}

// 初始化
if(sessionStorage.getItem('bds_auth')==='1') renderPipeline();
